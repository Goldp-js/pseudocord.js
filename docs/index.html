  <style>
/* pseudocord.js documentation — editorial dark interface
   Presentational styles only. Navigation, search and API data are unchanged. */
:root {
  color-scheme: dark;
  --bg: #0c0e0f;
  --sidebar-bg: #101213;
  --surface: #121516;
  --surface-hover: #191d1e;
  --surface-raised: #171b1d;
  --code-bg: #111516;
  --border: #292d2f;
  --border-soft: #202426;
  --text: #e9ebea;
  --sub: #b6bcb9;
  --muted: #858d89;
  --accent: #c8dfaa;
  --accent2: #b5d997;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  --sans: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --side: 264px;
  --top: 62px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 96px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.65 var(--sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; }
button { cursor: pointer; }
a { text-decoration: none; color: var(--accent); }
a:hover { color: #e0f2c7; }
::selection { color: #111612; background: #c8dfaa; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Shell / persistent navigation */
.app { display: flex; min-height: 100vh; }
.sidebar { position: fixed; inset: 0 auto 0 0; z-index: 50; width: var(--side); display: flex; flex-direction: column; background: var(--sidebar-bg); border-right: 1px solid var(--border); }
.brand { height: 112px; padding: 30px 22px 19px 24px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: flex-start; gap: 7px; }
.brand-link { min-width: 0; display: flex; align-items: center; gap: 11px; color: var(--text); }
.brand-link:hover { color: var(--text); }
.brand-mark { display: grid; place-items: center; flex: none; width: 29px; height: 29px; border: 1px solid #515b53; border-radius: 5px; color: var(--accent); font: 600 12px var(--mono); letter-spacing: -1px; }
.brand-name { display: block; color: var(--text); font-size: 16px; font-weight: 700; line-height: 1.1; letter-spacing: -.5px; }
.brand-name .dot { color: var(--accent); }
.brand-caption { display: block; font-size: 10px; line-height: 1.3; letter-spacing: .045em; color: var(--muted); margin-top: 7px; font-weight: 500; }
.branch-badge { margin: 1px 0 0 auto; border: 1px solid #3e483f; color: #b9c6b5; background: #202822; border-radius: 3px; padding: 4px 6px; font: 600 9px var(--mono); letter-spacing: .02em; }
.sidebar-nav { flex: 1; padding: 23px 10px 30px 13px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #3a4140 transparent; }
.nav-section { margin: 0 0 29px; }
.nav-label { margin: 0 0 9px; padding: 0 12px; font-size: 10.5px; letter-spacing: .065em; color: #8d9692; font-weight: 700; }
.nav-item { display: flex; align-items: center; min-height: 33px; gap: 8px; width: 100%; margin: 2px 0; padding: 7px 11px; border: none; border-left: 2px solid transparent; border-radius: 3px; background: transparent; color: #a7afab; text-align: left; font-size: 12.5px; font-weight: 450; line-height: 1.4; }
.nav-item:hover { color: #ecf0ec; background: #1a1e1e; }
.nav-item.active { color: #eaf3e3; background: #202720; border-left-color: var(--accent); font-weight: 620; }
.nav-icon { width: 17px; min-width: 17px; text-align: center; font: 500 11px/1.3 var(--mono); color: #828f89; }
.nav-item.active .nav-icon { color: var(--accent); }
.nav-number { margin-left: auto; font: 11px/1.3 var(--mono); font-variant-numeric: tabular-nums; color: #727c77; }
.sidebar-footer { display: flex; align-items: center; gap: 10px; padding: 16px 22px 21px; border-top: 1px solid var(--border); }
.online-dot { width: 7px; height: 7px; border-radius: 100%; background: #a0b89a; flex: none; }
.sidebar-footer strong { display: block; font-size: 11px; font-weight: 600; color: #b8c0b9; }
.sidebar-footer span { display: block; font-size: 10px; color: #7c8781; margin-top: 1px; }
.outbound { margin-left: auto; font-size: 16px; color: #a3aba5; }
.menu-btn, .mobile-close { display: none; }

/* Header, reading area and table of contents */
.content-shell { margin-left: var(--side); width: calc(100% - var(--side)); min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { position: sticky; top: 0; z-index: 35; height: var(--top); min-height: var(--top); display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 0 39px; background: #0c0e0ff0; backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
.breadcrumb { min-width: 0; display: flex; align-items: center; gap: 9px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; font-size: 12px; color: #888f8a; }
.breadcrumb span:last-child { color: #d8ddd9; font-weight: 570; text-overflow: ellipsis; overflow: hidden; }
.crumb-divider { color: #626965; }
.topbar-actions { display: flex; align-items: center; gap: 18px; flex: none; }
.search-trigger { display: flex; align-items: center; gap: 9px; width: 260px; height: 34px; padding: 0 10px; background: #151819; border: 1px solid #323738; border-radius: 5px; color: #a0a8a3; font-size: 11.5px; }
.search-trigger:hover { color: #e0e4e1; background: #191d1e; border-color: #515a54; }
.search-trigger span { text-align: left; flex: 1; }
.search-trigger svg, .search-head svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; }
.search-trigger kbd, .search-head kbd { background: #202425; border: 1px solid #353b38; border-radius: 4px; color: #a3aca6; font: 10px/1 var(--mono); padding: 5px 6px; white-space: nowrap; }
.github-icon { display: grid; place-items: center; width: 21px; height: 21px; color: #a1aaa3; }
.github-icon:hover { color: #e9edea; }
.github-icon svg { width: 100%; height: 100%; }
.page-shell { flex: 1; width: 100%; max-width: 1510px; display: grid; grid-template-columns: minmax(0, 1fr) 189px; gap: 60px; margin: 0 auto; padding: 0 46px 80px; }
.content { min-width: 0; padding-top: 54px; }
.article { max-width: 860px; padding-bottom: 36px; }
.toc { align-self: start; position: sticky; top: calc(var(--top) + 36px); max-height: calc(100vh - var(--top) - 60px); margin-top: 55px; padding: 0 0 8px 16px; border-left: 1px solid var(--border); overflow-y: auto; scrollbar-width: thin; }
.toc-label { margin: 0 0 12px; color: #aeb5af; font-size: 10px; font-weight: 670; letter-spacing: .075em; }
.toc-item { display: block; width: 100%; padding: 7px 8px 7px 13px; margin: 0 0 1px -17px; color: #8a938d; text-align: left; background: transparent; border: none; border-left: 2px solid transparent; font-size: 11.5px; line-height: 1.45; }
.toc-item:hover { color: #e3e8e2; }
.toc-item.active { color: var(--accent); border-left-color: var(--accent); }
.toc-item.level3 { padding-left: 24px; font-size: 11px; }
.site-footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 22px; padding: 23px 0 27px; margin: 0 46px; border-top: 1px solid var(--border-soft); color: #79837c; font-size: 10.5px; }
.site-footer a { color: #b4c8aa; }

/* Typography and editorial content */
.section-eyebrow { display: flex; align-items: center; gap: 8px; margin: 0 0 13px; color: #a9be9d; font-size: 10.5px; font-weight: 650; letter-spacing: .045em; text-transform: none; }
.section-eyebrow .line { width: 12px; height: 1px; background: #8aa37c; }
.page-title { margin: 0 0 12px; font-size: clamp(30px, 3.3vw, 43px); line-height: 1.15; letter-spacing: -1.7px; font-weight: 710; }
.lead { max-width: 720px; margin: 0 0 34px; color: #b0b9b1; font-size: 14.5px; line-height: 1.8; }
.prose { color: #bdc5bf; font-size: 13.5px; line-height: 1.84; }
.prose h1 { display: none; }
.prose h2 { margin: 44px 0 16px; padding: 0 0 11px; color: #e7ebe6; border-bottom: 1px solid var(--border); font-size: 19px; font-weight: 675; letter-spacing: -.5px; scroll-margin-top: 96px; }
.prose h3 { margin: 32px 0 13px; color: #e0e5df; font-size: 15px; font-weight: 660; scroll-margin-top: 96px; }
.prose p { margin: 12px 0 17px; }
.prose ul, .prose ol { margin: 12px 0 22px; padding-left: 22px; }
.prose li { margin: 6px 0; }
.prose li::marker { color: #8ba17e; }
.prose a { color: var(--accent); text-decoration: underline; text-decoration-color: #53684b; text-underline-offset: 4px; }
.prose strong { color: #e6ebe5; font-weight: 650; }
.prose blockquote { margin: 23px 0; padding: 13px 19px; background: #171c18; border: none; border-left: 2px solid #96aa85; color: #bdc9b8; }
.prose blockquote p { margin: 0; }
.prose code:not(pre code) { padding: 2px 5px; background: #202522; color: #d3e4cc; border: 1px solid #333b33; border-radius: 3px; font: 11.5px/1.55 var(--mono); overflow-wrap: anywhere; }
.prose table { display: block; width: 100%; margin: 22px 0 29px; overflow-x: auto; border: 1px solid var(--border); border-radius: 5px; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.prose th, .prose td { padding: 11px 15px; min-width: 110px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border-soft); }
.prose th { color: #d8dfd6; background: #191d1c; font-weight: 650; }
.prose td { color: #aeb7b0; }
.prose tr:last-child td { border-bottom: 0; }
.prose pre, .code-block { position: relative; margin: 19px 0 25px; overflow: hidden; border: 1px solid #303735; border-radius: 6px; background: var(--code-bg); }
.prose pre { padding: 47px 19px 19px; overflow-x: auto; }
.prose pre code, .code-block code { color: #d2d9d0; font: 12px/1.9 var(--mono); white-space: pre; tab-size: 4; }
.code-caption { position: absolute; inset: 0 0 auto; display: flex; align-items: center; justify-content: space-between; min-height: 35px; padding: 0 12px 0 18px; border-bottom: 1px solid #2b322f; background: #191e1c; color: #929e94; font: 10.5px var(--mono); }
.copy-code { padding: 5px 9px; border: 1px solid transparent; border-radius: 3px; background: transparent; color: #adb9ac; font-size: 10.5px; }
.copy-code:hover { color: #eaf3e6; background: #2a332b; }
.code-block pre { margin: 0; padding: 48px 19px 19px; overflow: auto; border: 0; border-radius: 0; background: transparent; }
.tok-key { color: #b7d2a6; }
.tok-string { color: #a6ccbe; }
.tok-num { color: #e4c99e; }
.tok-comment { color: #858f84; }

/* Landing page: quiet, typographic and technical */
.hero { position: relative; margin: -1px 0 0; padding: 8px 0 38px; border-bottom: 1px solid var(--border); }
.hero-version { display: inline-block; margin-bottom: 22px; padding: 4px 8px; border: 1px solid #445043; border-radius: 3px; background: #1b221b; color: #c1d8b7; font: 10.5px/1.5 var(--mono); }
.hero h1 { max-width: 780px; margin: 0 0 20px; font-size: clamp(42px, 5.4vw, 66px); line-height: 1.075; letter-spacing: -3.2px; font-weight: 690; }
.hero h1 em { color: var(--accent); font-style: normal; }
.hero > p { max-width: 570px; margin: 0 0 25px; color: #b5bdb6; font-size: 15px; line-height: 1.8; }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 13px; }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 15px; border: 1px solid #454e46; border-radius: 4px; background: #1c211e; color: #e4eae3; font-size: 12px; font-weight: 620; transition: background .15s, border-color .15s; }
.btn:hover { color: #fff; background: #272e28; border-color: #667962; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #162015; }
.btn.primary:hover { background: #d9edc1; color: #111812; }
.hero .hero-micro { margin: 23px 0 0; font: 11px/1.7 var(--mono); color: #808b80; }
.metric-row { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0 0 42px; padding: 18px 0 21px; border-bottom: 1px solid var(--border-soft); }
.metric { padding: 5px 22px 4px 0; border-right: 1px solid var(--border-soft); }
.metric + .metric { padding-left: 28px; }
.metric:last-child { border: none; }
.metric strong { display: block; margin-bottom: 2px; color: #dce2db; font-size: 23px; font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -.7px; }
.metric span { color: #8e9a90; font-size: 11px; }
.landing-section-title { margin: 37px 0 14px; color: #e3e9e2; font-size: 18px; font-weight: 680; letter-spacing: -.4px; }
.landing-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 25px; border-top: 1px solid var(--border); }
.landing-card { display: block; position: relative; min-height: 119px; padding: 24px 36px 22px 0; border-bottom: 1px solid var(--border); color: var(--text); }
.landing-card:hover { color: #fff; }
.landing-card .tile-icon { display: none; }
.landing-card strong { display: block; margin: 1px 0 6px; font-size: 14px; font-weight: 660; line-height: 1.35; }
.landing-card .desc { display: block; max-width: 310px; color: #97a199; font-size: 12px; line-height: 1.7; }
.landing-card .arrow { position: absolute; right: 7px; top: 20px; font-size: 15px; color: #839284; transition: transform .15s ease, color .15s ease; }
.landing-card:hover .arrow { transform: translate(2px,-2px); color: var(--accent); }

/* Reference catalogue, filters, individual reference entries */
.ref-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin: 25px 0 22px; }
.ref-toolbar input { width: 100%; max-width: 490px; min-height: 41px; padding: 10px 13px; border: 1px solid #3b4240; border-radius: 4px; outline: none; background: #15191a; color: #e6ebe5; font-size: 12.5px; }
.ref-toolbar input:focus { border-color: #91a587; box-shadow: 0 0 0 3px #7a967b22; }
.ref-toolbar input::placeholder { color: #8b958c; }
.ref-count { color: #8d978e; font: 11px var(--mono); white-space: nowrap; }
.category-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 0 28px; margin: 12px 0 34px; border-top: 1px solid var(--border); }
.category-card { display: flex; align-items: flex-start; gap: 14px; min-width: 0; padding: 19px 0 20px; color: var(--text); border-bottom: 1px solid var(--border); }
.category-card:hover { color: var(--text); }
.category-icon { width: 22px; flex: none; padding-top: 2px; color: #98b38a; text-align: center; font: 13px var(--mono); }
.category-card > span:nth-child(2) { flex: 1; min-width: 0; }
.category-card strong { display: block; margin-bottom: 4px; font-size: 13px; font-weight: 640; }
.category-card small { display: block; color: #98a19a; font-size: 11.5px; line-height: 1.65; }
.category-card .count { color: #7e8c7d; font: 11px var(--mono); }
.category-card:hover strong { color: var(--accent); }
.filter-pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 19px; }
.filter-pill { padding: 7px 12px; background: transparent; border: 1px solid #38403b; border-radius: 4px; color: #aab4aa; font-size: 11px; }
.filter-pill:hover { color: #eef3ed; border-color: #657763; }
.filter-pill.active { color: #d6e8ce; background: #252e24; border-color: #50654b; }
.function-list { border-top: 1px solid var(--border); }
.function-item { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 3px 17px 0; color: #e1e6df; border-bottom: 1px solid var(--border-soft); }
.function-item:hover { color: #fff; background: #111513; }
.function-name { font: 600 12.5px/1.45 var(--mono); color: #bcd9af; overflow-wrap: anywhere; }
.function-desc { display: block; margin-top: 5px; color: #969f97; font-size: 12px; line-height: 1.6; }
.function-arrow { flex: none; font-size: 13px; color: #778376; }
.tag { display: inline-block; vertical-align: middle; margin-left: 9px; padding: 3px 5px; background: #1c2220; border: 1px solid #354137; border-radius: 3px; color: #a5b1a2; font: 9px/1.35 var(--mono); letter-spacing: .015em; }
.tag.deprecated { color: #d3b78f; background: #2b241a; border-color: #4f4131; }
.tag.canonical { color: #bfdbb8; background: #1e2b20; border-color: #3b553d; }
.back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 28px; color: #a3b59d; font-size: 12px; }
.back-link:hover { color: var(--accent); }
.function-header { padding-bottom: 24px; margin-bottom: 29px; border-bottom: 1px solid var(--border); }
.function-header .title-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 7px; }
.function-header h1 { margin: 0 0 11px; color: #e7ebe6; font: 650 clamp(25px,3.2vw,37px)/1.25 var(--mono); letter-spacing: -1.1px; overflow-wrap: anywhere; }
.function-header p { max-width: 660px; margin: 3px 0; color: #b6c0b6; font-size: 14px; line-height: 1.8; }
.function-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.meta-pill { padding: 4px 9px; border: 1px solid #303934; border-radius: 3px; color: #9da99d; background: #171c18; font: 10.5px var(--sans); }
.fn-section { margin-bottom: 28px; }
.fn-section h2 { margin: 35px 0 12px; color: #e6eae5; font-size: 18px; font-weight: 660; letter-spacing: -.35px; scroll-margin-top: 94px; }
.fn-section p { max-width: 700px; margin: 10px 0 16px; color: #b0b9b1; font-size: 13.5px; line-height: 1.85; }
.fn-case { padding: 15px 18px; border-left: 2px solid #7c9771; background: #171d18; display: flex; align-items: flex-start; gap: 11px; }
.case-icon { flex: none; padding-top: 0; color: #9bbf90; font-size: 13px; }
.fn-case strong { display: block; margin: 0 0 4px; color: #d5e2d0; font-size: 12px; font-weight: 650; }
.fn-case p { margin: 0; color: #aeb9aa; font-size: 12.5px; }
.next-row { display: flex; gap: 20px; margin-top: 49px; padding-top: 19px; border-top: 1px solid var(--border); }
.next-card { display: block; flex: 1; min-width: 0; padding: 11px 5px 12px 0; color: #dfe7dc; overflow-wrap: anywhere; }
.next-card:hover { color: var(--accent); }
.next-card small { display: block; margin-bottom: 6px; color: #8d998b; font-size: 11px; }
.next-card strong { font: 600 12px/1.5 var(--mono); }
.empty-results { padding: 35px 14px; text-align: center; color: #8c978d; }
.empty-results strong { display: block; font-size: 13px; color: #d4dcd3; }
.empty-results p { margin: 7px 0 0; font-size: 12px; }

/* Search dialog */
.search-dialog { position: fixed; inset: 0; z-index: 85; display: none; align-items: flex-start; justify-content: center; padding: 12vh 16px 24px; }
.search-dialog.open { display: flex; }
.search-overlay { position: absolute; inset: 0; background: #070909cb; backdrop-filter: blur(3px); }
.search-panel { position: relative; width: min(660px,100%); overflow: hidden; background: #15191a; border: 1px solid #485149; border-radius: 8px; box-shadow: 0 24px 95px #000a; }
.search-head { display: flex; align-items: center; gap: 13px; padding: 15px 18px; border-bottom: 1px solid #343d37; color: var(--accent); }
.search-head input { flex: 1; width: 100%; min-width: 0; padding: 2px 0; border: 0; outline: none; background: transparent; color: var(--text); font-size: 14px; }
.search-head input::placeholder { color: #8b988e; }
.search-results { max-height: 54vh; padding: 7px; overflow-y: auto; }
.search-result { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 12px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #e0e8df; text-align: left; }
.search-result:hover, .search-result.selected { background: #263026; border-color: #3f5240; }
.search-result .result-icon { flex: none; display: grid; place-items: center; width: 27px; height: 27px; color: #bad4af; border: 1px solid #3f5340; border-radius: 4px; background: #1b261d; font: 12px var(--mono); }
.search-result strong { display: block; font-size: 12.5px; font-weight: 620; line-height: 1.45; }
.search-result small { display: block; margin-top: 3px; font-size: 11.5px; line-height: 1.55; color: #a1ada2; }
.search-result em { margin-left: auto; color: #92a08e; font-size: 10px; font-style: normal; white-space: nowrap; }
.search-foot { display: flex; flex-wrap: wrap; gap: 16px; padding: 10px 16px; background: #1a1f1b; border-top: 1px solid #303a32; color: #91a08f; font: 10px var(--mono); }
.sidebar-backdrop { display: none; }

/* Responsive documentation layout */
@media (max-width: 1300px) {
  .page-shell { gap: 35px; grid-template-columns: minmax(0,1fr) 168px; padding-right: 30px; padding-left: 34px; }
  .topbar { padding: 0 30px 0 34px; }
  .site-footer { margin: 0 34px; }
}

window.PSEUDOCORD_DOCS={"meta":{"name":"pseudocord.js","version":"0.31.0-alpha.1","branch":"alpha","url":"https://github.com/Goldp-js/pseudocord.js","generatedFrom":"Referencia de API pública de la serie alpha"},"groups":{"text":{"title":"Texto","summary":"Manipulación, búsqueda y formato de cadenas."},"mathematics":{"title":"Matemáticas","summary":"Operaciones numéricas, redondeo, trigonometría y límites."},"randomization":{"title":"Aleatoriedad","summary":"Selección aleatoria, mezcla de datos e identificadores."},"collections":{"title":"Colecciones","summary":"Listas, conjuntos, mapas y operaciones con elementos."},"type_conversion":{"title":"Conversión de tipos","summary":"Convertir y verificar valores entre tipos."},"date_time":{"title":"Fecha y hora","summary":"Fechas, marcas temporales e intervalos."},"json":{"title":"JSON","summary":"Interpretación y serialización de datos JSON."},"regular_expressions":{"title":"Expresiones regulares","summary":"Coincidencias de texto y patrones seguros."},"encoding":{"title":"Codificación","summary":"Base64, direcciones URL y transformación de datos."},"logging":{"title":"Utilidades y registros","summary":"Registros, valores predeterminados y consola."},"language_aliases":{"title":"Funciones del lenguaje","summary":"Nombres de estilo DSL, operaciones generales y compatibilidad."},"command_context":{"title":"Contexto de comandos","summary":"Información de comandos, argumentos y tiempos de espera."},"discord_entities":{"title":"Entidades de Discord","summary":"Usuarios, miembros, roles, mensajes y canales."},"http":{"title":"Solicitudes HTTP","summary":"Consultas HTTPS y utilidades para respuestas remotas."},"discord_resources":{"title":"Recursos de Discord","summary":"Consultas y acciones sobre los recursos de Discord."},"runtime_utilities":{"title":"Herramientas de bot","summary":"Diagnóstico, moderación auxiliar, ficheros y formatos."},"discord_components":{"title":"Componentes y mensajes","summary":"Botones, menús, embeds, mensajes y validación."},"general_utilities":{"title":"Utilidades generales","summary":"Funciones de apoyo para texto, números, fechas y estructuras."},"storage":{"title":"Persistencia","summary":"Datos de usuarios, servidores y ámbito global."}},"guides":[{"id":"inicio","title":"Introducción","group":"Comenzar","summary":"Bots de Discord escritos en pseudocódigo en español.","html":"<h1>Documentación de pseudocord.js</h1>\n<p>Biblioteca para desarrollar bots de Discord mediante archivos de pseudocódigo en español y una aplicación Node.js.</p>\n<blockquote>\n<p><strong>Estado del proyecto:</strong> Alpha · <strong>Serie documentada:</strong> <code>0.31.0-alpha.1</code> · <strong>Runtime mínimo:</strong> Node.js 22.13.</p>\n</blockquote>\n<h2>Comenzar</h2>\n<p>Instalación del paquete:</p>\n<pre><code class=\"language-bash\">npm install pseudocord.js@alpha\n</code></pre>\n<p>Primera orden en <code>commands/ping.pdiscord</code>:</p>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;ping&quot; DESCRIPCION &quot;Comprueba el estado del bot&quot;\n    RESPONDER &quot;Pong!&quot;\nFIN COMANDO\n</code></pre>\n<p>Entrada JavaScript en <code>bot.mjs</code>:</p>\n<pre><code class=\"language-javascript\">import { PseudoClient } from 'pseudocord.js';\n\nconst bot = new PseudoClient({\n  token: process.env.DISCORD_TOKEN,\n  commands: { sync: 'auto' }\n});\n\nbot.loadCommands('./commands');\nawait bot.start();\n</code></pre>\n<h2>Capacidades principales</h2>\n<ul>\n<li>Comandos slash, comandos con prefijo y comandos de contexto.</li>\n<li>Argumentos tipados, subcomandos, permisos y límites de uso.</li>\n<li>Eventos, componentes interactivos, embeds y formularios.</li>\n<li>Funciones y estructuras del lenguaje, módulos y tareas programadas.</li>\n<li>Consultas HTTP y persistencia mediante SQLite, PostgreSQL o Redis.</li>\n<li>Plugins JavaScript cargados mediante <code>PseudoClient.plugins</code>.</li>\n</ul>\n<h2>Convenciones</h2>\n<p>Los ejemplos de pseudocódigo utilizan archivos <code>.pdiscord</code> o <code>.pd</code>. Las referencias a <code>contexto.*</code> requieren un comando o evento correspondiente. Las funciones que consultan recursos de Discord pueden requerir permisos, intents o datos accesibles del servidor. Las operaciones asíncronas pueden generar errores de red o de permisos.</p>\n<h2>Navegación</h2>\n<p>La guía de <a href=\"#/guide/primer-bot\">Primer bot</a> explica la estructura mínima. La sección de <a href=\"#/reference\">Referencia de funciones</a> permite buscar por nombre y consultar una ficha individual con ejemplo y caso de uso.</p>\n"},{"id":"instalacion","title":"Instalación","group":"Comenzar","summary":"Requisitos y dependencias para iniciar el proyecto.","html":"<h1>Instalación</h1>\n<h2>Requisitos</h2>\n<ul>\n<li>Node.js <strong>22.13 o superior</strong>.</li>\n<li>Una aplicación de Discord con bot y token válido.</li>\n<li>Permisos e intents acordes con las funcionalidades utilizadas.</li>\n</ul>\n<h2>Proyecto Node.js</h2>\n<pre><code class=\"language-bash\">mkdir mi-bot\ncd mi-bot\nnpm init -y\nnpm install pseudocord.js@alpha\n</code></pre>\n<p>Configurar el paquete para utilizar módulos ESM:</p>\n<pre><code class=\"language-json\">{\n  &quot;type&quot;: &quot;module&quot;,\n  &quot;scripts&quot;: {\n    &quot;start&quot;: &quot;node bot.mjs&quot;\n  }\n}\n</code></pre>\n<p>Guardar el token como variable de entorno <code>DISCORD_TOKEN</code>. No incluir tokens en archivos versionados.</p>\n<h2>Estructura recomendada</h2>\n<pre><code class=\"language-text\">mi-bot/\n├── bot.mjs\n├── commands/\n│   ├── ping.pdiscord\n│   └── perfil.pdiscord\n├── plugins/\n│   └── utilidades.mjs\n└── package.json\n</code></pre>\n<h2>Selección de versión</h2>\n<pre><code class=\"language-bash\">npm install pseudocord.js@alpha\n</code></pre>\n<p>La etiqueta <code>alpha</code> sigue las versiones preliminares publicadas bajo esa etiqueta; una versión concreta puede fijarse con <code>npm install pseudocord.js@0.31.0-alpha.1</code> cuando esté disponible en el registro.</p>\n"},{"id":"primer-bot","title":"Primer bot","group":"Comenzar","summary":"Ejemplo completo de un bot con comando slash.","html":"<h1>Primer bot</h1>\n<h2>1. Crear el comando</h2>\n<p>Archivo <code>commands/ping.pdiscord</code>:</p>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;ping&quot; DESCRIPCION &quot;Verifica la conexión&quot;\n    RESPONDER &quot;Pong!&quot;\nFIN COMANDO\n</code></pre>\n<h2>2. Crear la aplicación</h2>\n<p>Archivo <code>bot.mjs</code>:</p>\n<pre><code class=\"language-javascript\">import { PseudoClient } from 'pseudocord.js';\n\nconst bot = new PseudoClient({\n  token: process.env.DISCORD_TOKEN,\n  commands: {\n    sync: 'auto',\n    mode: 'upsert'\n  }\n});\n\nbot.loadCommands('./commands');\nawait bot.start();\n</code></pre>\n<h2>3. Ejecutar</h2>\n<pre><code class=\"language-bash\">node bot.mjs\n</code></pre>\n<p>El bot necesita estar agregado a un servidor con los ámbitos de instalación adecuados. La aparición de comandos globales puede tardar en propagarse.</p>\n<h2>4. Agregar un argumento</h2>\n<p>Archivo <code>commands/saludar.pdiscord</code>:</p>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;saludar&quot; DESCRIPCION &quot;Saluda a una persona&quot;\n    OPCION objetivo TIPO usuario DESCRIPCION &quot;Destinatario&quot; OPCIONAL\n    RESPONDER &quot;Hola {OBTENER_NOMBRE(coalescer(argumentos.objetivo, contexto.usuario))}&quot;\nFIN COMANDO\n</code></pre>\n<p><code>argumentos.objetivo</code> obtiene la opción del comando y <code>contexto.usuario</code> identifica al ejecutor. La función <code>coalescer()</code> usa el ejecutor cuando no se proporciona destinatario.</p>\n<h2>Siguiente paso</h2>\n<p>Consultar <a href=\"#/guide/configuracion\">Configuración</a>, <a href=\"#/guide/comandos\">Comandos</a> y <a href=\"#/reference\">Referencia de funciones</a>.</p>\n"},{"id":"configuracion","title":"Configuración de PseudoClient","group":"Comenzar","summary":"Opciones públicas del cliente, comandos y almacenamiento.","html":"<h1>Configuración de PseudoClient</h1>\n<p><code>new PseudoClient(options)</code> configura el bot antes del inicio. Los ajustes se proporcionan desde JavaScript o TypeScript.</p>\n<pre><code class=\"language-javascript\">const bot = new PseudoClient({\n  token: process.env.DISCORD_TOKEN,\n  prefix: '!',\n  projectRoot: process.cwd(),\n  commands: {\n    sync: 'manual',\n    mode: 'upsert',\n    cacheSeconds: 900,\n    pruneManaged: false\n  },\n  interactions: { autoDefer: false },\n  maxIterations: 100000,\n  maxExecutionMs: 10000\n});\n</code></pre>\n<h2>Opciones principales</h2>\n<table>\n<thead>\n<tr>\n<th>Opción</th>\n<th>Tipo</th>\n<th>Descripción</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>token</code></td>\n<td><code>string</code></td>\n<td>Token del bot de Discord. Es obligatorio para <code>start()</code>.</td>\n</tr>\n<tr>\n<td><code>intents</code></td>\n<td><code>string[]</code></td>\n<td>Nombres de intents de Discord; si se omiten, se infieren de las declaraciones.</td>\n</tr>\n<tr>\n<td><code>partials</code></td>\n<td><code>string[]</code></td>\n<td>Tipos de objetos parciales admitidos por discord.js.</td>\n</tr>\n<tr>\n<td><code>prefix</code></td>\n<td><code>string</code></td>\n<td>Prefijo predeterminado de comandos de mensaje.</td>\n</tr>\n<tr>\n<td><code>guildId</code></td>\n<td><code>string</code></td>\n<td>ID de servidor para el registro de comandos cuando corresponde.</td>\n</tr>\n<tr>\n<td><code>projectRoot</code></td>\n<td><code>string</code></td>\n<td>Directorio base para archivos y plugins.</td>\n</tr>\n<tr>\n<td><code>presence</code></td>\n<td><code>object</code></td>\n<td>Estado y actividades de presencia.</td>\n</tr>\n<tr>\n<td><code>database</code></td>\n<td><code>object</code></td>\n<td>Almacenamiento persistente.</td>\n</tr>\n<tr>\n<td><code>cooldownStorage</code></td>\n<td><code>'memory' | 'database'</code></td>\n<td>Destino de los cooldowns.</td>\n</tr>\n<tr>\n<td><code>plugins</code></td>\n<td><code>string[]</code></td>\n<td>Especificadores de plugins JavaScript.</td>\n</tr>\n<tr>\n<td><code>maxIterations</code></td>\n<td><code>number</code></td>\n<td>Límite de iteraciones de ejecución.</td>\n</tr>\n<tr>\n<td><code>maxExecutionMs</code></td>\n<td><code>number</code></td>\n<td>Límite temporal de ejecución en milisegundos.</td>\n</tr>\n<tr>\n<td><code>schedulerTimeZone</code></td>\n<td><code>string</code></td>\n<td>Zona horaria IANA para tareas programadas.</td>\n</tr>\n<tr>\n<td><code>interactions</code></td>\n<td><code>object</code></td>\n<td>Configuración de respuestas diferidas de interacciones.</td>\n</tr>\n<tr>\n<td><code>commands</code></td>\n<td><code>object</code></td>\n<td>Comportamiento de sincronización de comandos.</td>\n</tr>\n</tbody>\n</table>\n<h2>Sincronización de comandos</h2>\n<table>\n<thead>\n<tr>\n<th>Opción</th>\n<th>Valores</th>\n<th>Comportamiento</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>commands.sync</code></td>\n<td><code>manual</code>, <code>auto</code>, <code>off</code></td>\n<td><code>manual</code> evita publicar automáticamente; <code>auto</code> publica al iniciar; <code>off</code> desactiva la sincronización.</td>\n</tr>\n<tr>\n<td><code>commands.mode</code></td>\n<td><code>upsert</code>, <code>replace</code></td>\n<td>Estrategia de sincronización REST.</td>\n</tr>\n<tr>\n<td><code>commands.cacheSeconds</code></td>\n<td><code>number</code></td>\n<td>Intervalo de caché de sincronización.</td>\n</tr>\n<tr>\n<td><code>commands.pruneManaged</code></td>\n<td><code>boolean</code></td>\n<td>Control de eliminación de comandos gestionados.</td>\n</tr>\n</tbody>\n</table>\n<p>Sincronización explícita en modo manual:</p>\n<pre><code class=\"language-javascript\">await bot.start();\nconst stats = await bot.syncCommands({ force: true });\nconsole.log(stats);\n</code></pre>\n<h2>Respuestas diferidas</h2>\n<pre><code class=\"language-javascript\">interactions: {\n  autoDefer: true,\n  deferAfterMs: 1800,\n  ephemeral: false\n}\n</code></pre>\n<p><code>autoDefer</code> está desactivado por defecto. <code>deferAfterMs</code> admite valores entre 250 y 2500. Los formularios modales requieren un tipo de primera respuesta compatible.</p>\n<h2>Presencia</h2>\n<pre><code class=\"language-javascript\">presence: {\n  status: 'online',\n  activities: [{ name: 'Comandos en español', type: 0 }]\n}\n</code></pre>\n<h2>Persistencia SQLite</h2>\n<pre><code class=\"language-javascript\">database: {\n  provider: 'sqlite',\n  namespace: 'mi-bot',\n  sqliteFile: './data/bot.sqlite'\n}\n</code></pre>\n<h2>Persistencia PostgreSQL</h2>\n<pre><code class=\"language-javascript\">database: {\n  provider: 'postgresql',\n  namespace: 'mi-bot',\n  connectionString: process.env.DATABASE_URL\n}\n</code></pre>\n<h2>Persistencia Redis</h2>\n<pre><code class=\"language-javascript\">database: {\n  provider: 'redis',\n  namespace: 'mi-bot',\n  url: process.env.REDIS_URL\n}\n</code></pre>\n<p>La configuración de base de datos requiere un proveedor compatible y datos de conexión. Para cooldowns persistentes se utiliza <code>cooldownStorage: 'database'</code> junto con <code>database</code>.</p>\n"},{"id":"comandos","title":"Comandos","group":"Lenguaje DSL","summary":"Slash, prefijos, comandos contextuales y subcomandos.","html":"<h1>Comandos</h1>\n<h2>Comando slash</h2>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;estado&quot; DESCRIPCION &quot;Consulta el estado del bot&quot;\n    RESPONDER &quot;En línea&quot;\nFIN COMANDO\n</code></pre>\n<h2>Comando con prefijo</h2>\n<pre><code class=\"language-text\">COMANDO MENSAJE &quot;hola&quot; PREFIJO &quot;!&quot; ALIAS &quot;saludo&quot;\n    RESPONDER &quot;Hola&quot;\nFIN COMANDO\n</code></pre>\n<p>El prefijo también puede definirse desde <code>PseudoClient.prefix</code> cuando el comando no fija uno de manera explícita.</p>\n<h2>Comando de contexto</h2>\n<pre><code class=\"language-text\">COMANDO USUARIO &quot;Ver perfil&quot;\n    RESPONDER &quot;Usuario seleccionado&quot;\nFIN COMANDO\n</code></pre>\n<p>También se admiten comandos contextuales de mensaje.</p>\n<h2>Subcomandos</h2>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;perfil&quot; DESCRIPCION &quot;Opciones de perfil&quot;\n    SUBCOMANDO &quot;ver&quot; DESCRIPCION &quot;Consulta información&quot;\n        RESPONDER &quot;Perfil solicitado&quot;\n    FIN SUBCOMANDO\nFIN COMANDO\n</code></pre>\n<h2>Permisos</h2>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;panel&quot; DESCRIPCION &quot;Panel de administración&quot;\n    PERMISOS ADMINISTRADOR\n    ERROR PERMISOS &quot;No tienes permiso para usar este comando&quot;\n    RESPONDER &quot;Panel disponible&quot;\nFIN COMANDO\n</code></pre>\n<p>La operación sigue sujeta a los permisos de Discord y a la jerarquía de roles.</p>\n<h2>Cooldown</h2>\n<pre><code class=\"language-text\">COMANDO MENSAJE &quot;sorteo&quot; PREFIJO &quot;!&quot;\n    COOLDOWN &quot;10s&quot; POR USUARIO ERROR &quot;Espera antes de repetir el comando&quot;\n    RESPONDER &quot;Intento recibido&quot;\nFIN COMANDO\n</code></pre>\n<p>Los ámbitos admitidos incluyen usuario, servidor, canal y global.</p>\n"},{"id":"argumentos","title":"Opciones y argumentos","group":"Lenguaje DSL","summary":"Tipos admitidos, opciones requeridas y contexto del ejecutor.","html":"<h1>Opciones y argumentos</h1>\n<h2>Tipos admitidos</h2>\n<p>Los comandos admiten los tipos <code>texto</code>, <code>entero</code>, <code>numero</code>, <code>booleano</code>, <code>usuario</code>, <code>canal</code>, <code>rol</code>, <code>mencionable</code> y <code>adjunto</code>.</p>\n<h2>Argumento obligatorio</h2>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;doble&quot; DESCRIPCION &quot;Duplica un número&quot;\n    OPCION valor TIPO numero DESCRIPCION &quot;Número&quot; REQUERIDO\n    RESPONDER &quot;Resultado: {argumentos.valor * 2}&quot;\nFIN COMANDO\n</code></pre>\n<h2>Opción opcional</h2>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;avatar&quot; DESCRIPCION &quot;Consulta un avatar&quot;\n    OPCION objetivo TIPO usuario DESCRIPCION &quot;Usuario&quot; OPCIONAL\n    RESPONDER &quot;{AVATAR_DE(coalescer(argumentos.objetivo, contexto.usuario))}&quot;\nFIN COMANDO\n</code></pre>\n<h2>Argumentos con prefijo</h2>\n<pre><code class=\"language-text\">COMANDO MENSAJE &quot;decir&quot; PREFIJO &quot;!&quot;\n    ARGUMENTO contenido TIPO texto REQUERIDO RESTO\n    RESPONDER &quot;{argumentos.contenido}&quot;\nFIN COMANDO\n</code></pre>\n<h2>Contexto sin ambigüedades</h2>\n<table>\n<thead>\n<tr>\n<th>Ruta</th>\n<th>Significado</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>contexto.usuario</code></td>\n<td>Usuario que ejecuta la acción.</td>\n</tr>\n<tr>\n<td><code>contexto.miembro</code></td>\n<td>Miembro del servidor actual, cuando esté disponible.</td>\n</tr>\n<tr>\n<td><code>contexto.canal</code></td>\n<td>Canal del comando o evento.</td>\n</tr>\n<tr>\n<td><code>contexto.servidor</code></td>\n<td>Servidor actual.</td>\n</tr>\n<tr>\n<td><code>argumentos.nombre</code></td>\n<td>Valor de una opción llamada <code>nombre</code>.</td>\n</tr>\n<tr>\n<td><code>contexto.argumentos.nombre</code></td>\n<td>Ruta explícita alternativa a <code>argumentos.nombre</code>.</td>\n</tr>\n</tbody>\n</table>\n<p>Cuando una opción se llama <code>usuario</code>, usar <code>argumentos.usuario</code> para la opción y <code>contexto.usuario</code> para el ejecutor.</p>\n<h2>Errores de argumento</h2>\n<pre><code class=\"language-text\">COMANDO MENSAJE &quot;eco&quot; PREFIJO &quot;!&quot;\n    ARGUMENTO mensaje TIPO texto REQUERIDO RESTO ERROR FALTANTE &quot;Indica un mensaje&quot;\n    RESPONDER &quot;{argumentos.mensaje}&quot;\nFIN COMANDO\n</code></pre>\n"},{"id":"eventos","title":"Eventos","group":"Lenguaje DSL","summary":"Eventos del bot y eventos de Discord disponibles en el DSL.","html":"<h1>Eventos</h1>\n<p>Los eventos se declaran con <code>AL</code> seguido del nombre de un evento admitido.</p>\n<h2>Inicio del bot</h2>\n<pre><code class=\"language-text\">AL INICIAR cliente\n    IMPRIMIR &quot;Bot listo&quot;\nFIN\n</code></pre>\n<h2>Mensajes</h2>\n<pre><code class=\"language-text\">AL MENSAJE mensaje\n    SI mensaje.content CONTIENE &quot;hola&quot;\n        IMPRIMIR &quot;Saludo recibido&quot;\n    FIN SI\nFIN\n</code></pre>\n<h2>Miembros</h2>\n<pre><code class=\"language-text\">AL MIEMBRO_ENTRA usuario\n    IMPRIMIR &quot;Nuevo miembro: &quot;, OBTENER_NOMBRE(usuario)\nFIN\n</code></pre>\n<h2>Eventos disponibles</h2>\n<p>Los alias públicos incluyen <code>INICIAR</code>, <code>LISTO</code>, <code>MENSAJE</code>, <code>MENSAJE_CREADO</code>, <code>MENSAJE_EDITADO</code>, <code>MENSAJE_ELIMINADO</code>, <code>MIEMBRO_ENTRA</code>, <code>MIEMBRO_SALE</code>, <code>INTERACCION</code>, <code>REACCION</code>, <code>VOZ</code>, <code>CANAL_CREADO</code>, <code>CANAL_ELIMINADO</code>, <code>ROL_CREADO</code>, <code>HILO_CREADO</code>, <code>PRESENCIA</code>, <code>BAN</code>, <code>DESBAN</code>, <code>ENCUESTA_VOTO</code>, <code>SERVIDOR_ENTRA</code> y <code>SERVIDOR_SALE</code>.</p>\n<p>La disponibilidad de eventos depende de los intents, permisos y datos facilitados por Discord.</p>\n"},{"id":"interacciones","title":"Interacciones y componentes","group":"Lenguaje DSL","summary":"Botones, menús, formularios y respuestas efímeras.","html":"<h1>Interacciones y componentes</h1>\n<h2>Funciones para componentes</h2>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;panel&quot; DESCRIPCION &quot;Panel de acciones&quot;\n    RESPONDER MENSAJE_CON_BOTONES(&quot;Selecciona una opción&quot;, [CREAR_BOTON(&quot;Aceptar&quot;, &quot;aceptar&quot;)])\nFIN COMANDO\n</code></pre>\n<h2>Procesar botones</h2>\n<pre><code class=\"language-text\">AL BOTON &quot;aceptar&quot;\n    RESPONDER &quot;Acción confirmada&quot; EFIMERO\nFIN\n</code></pre>\n<h2>Menús</h2>\n<p>Las funciones <code>OPCION_MENU()</code>, <code>CREAR_MENU()</code> y <code>MENU_MULTIPLE()</code> permiten construir selectores con opciones. <code>OPCIONES_MENU()</code> consulta las selecciones de una interacción.</p>\n<h2>Formularios modales</h2>\n<p><code>CREAR_FORMULARIO()</code> construye un modal. <code>LEER_CAMPO_MODAL()</code> obtiene el valor de un campo durante la interacción del formulario.</p>\n<h2>Respuestas efímeras</h2>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;privado&quot; DESCRIPCION &quot;Envía una respuesta privada&quot;\n    RESPONDER &quot;Solo visible para quien ejecutó el comando&quot; EFIMERO\nFIN COMANDO\n</code></pre>\n<p>Consultar la categoría <a href=\"#/reference/discord_components\">Componentes y mensajes</a> para todas las funciones de construcción y validación.</p>\n"},{"id":"lenguaje","title":"Fundamentos del lenguaje","group":"Lenguaje DSL","summary":"Variables, tipos, funciones, operadores y expresiones.","html":"<h1>Fundamentos del lenguaje</h1>\n<h2>Variables y constantes</h2>\n<pre><code class=\"language-text\">VARIABLE puntos = 10\nCONSTANTE nombre = &quot;Bot&quot;\nVARIABLE activo: BOOLEANO = VERDADERO\n</code></pre>\n<h2>Operadores</h2>\n<pre><code class=\"language-text\">VARIABLE suma = 5 + 3\nVARIABLE mayor = 10 &gt; 3\nVARIABLE negacion = NO VERDADERO\nVARIABLE texto = &quot;Hola {nombre}&quot;\n</code></pre>\n<p>Hay operaciones aritméticas, comparaciones, operadores lógicos e interpolación de expresiones entre llaves dentro de cadenas.</p>\n<h2>Funciones</h2>\n<pre><code class=\"language-text\">FUNCION doble(numero: ENTERO): ENTERO\n    RETORNAR numero * 2\nFIN FUNCION\n\nCOMANDO BARRA &quot;calcular&quot; DESCRIPCION &quot;Calcula un doble&quot;\n    RESPONDER &quot;{doble(7)}&quot;\nFIN COMANDO\n</code></pre>\n<h2>Colecciones</h2>\n<pre><code class=\"language-text\">VARIABLE numeros = [1, 2, 3]\nVARIABLE ordenados = ordenar([3, 1, 2])\nVARIABLE nombres = dividir(&quot;Ana,Luis&quot;, &quot;,&quot;)\n</code></pre>\n<h2>Tipos declarados</h2>\n<p>El DSL admite anotaciones en variables, parámetros y resultados de funciones. Los errores de sintaxis y las incompatibilidades se muestran antes de iniciar el bot.</p>\n<h2>Comentarios</h2>\n<pre><code class=\"language-text\">// Comentario de una línea\n/* Comentario en bloque */\n</code></pre>\n"},{"id":"flujo","title":"Control de flujo","group":"Lenguaje DSL","summary":"Condicionales, bucles, errores y ejecución controlada.","html":"<h1>Control de flujo</h1>\n<h2>Condiciones</h2>\n<pre><code class=\"language-text\">SI puntos &gt;= 10\n    IMPRIMIR &quot;Objetivo alcanzado&quot;\nSINO\n    IMPRIMIR &quot;Faltan puntos&quot;\nFIN SI\n</code></pre>\n<h2>Bucles por rango</h2>\n<pre><code class=\"language-text\">PARA i DESDE 1 HASTA 5\n    IMPRIMIR i\nFIN PARA\n</code></pre>\n<h2>Recorrer listas</h2>\n<pre><code class=\"language-text\">PARA CADA valor EN [&quot;a&quot;, &quot;b&quot;, &quot;c&quot;]\n    IMPRIMIR valor\nFIN PARA\n</code></pre>\n<h2>Mientras</h2>\n<pre><code class=\"language-text\">VARIABLE intento = 0\nMIENTRAS intento &lt; 3\n    intento++\nFIN MIENTRAS\n</code></pre>\n<h2>Repetir</h2>\n<pre><code class=\"language-text\">REPETIR 3 VECES\n    IMPRIMIR &quot;Intento&quot;\nFIN REPETIR\n</code></pre>\n<h2>Gestión de errores</h2>\n<pre><code class=\"language-text\">INTENTAR\n    LANZAR &quot;Operación cancelada&quot;\nCAPTURAR error\n    IMPRIMIR error\nFIN INTENTAR\n</code></pre>\n<h2>Controles adicionales</h2>\n<p>El lenguaje incorpora <code>SEGUN</code>, <code>ROMPER</code>, <code>CONTINUAR</code>, <code>AFIRMAR</code>, <code>ESPERAR</code>, <code>PARALELO</code>, <code>CARRERA</code>, <code>TIEMPO_LIMITE</code> y variantes de repetición. El límite <code>maxIterations</code> y el tiempo <code>maxExecutionMs</code> pueden configurarse en <code>PseudoClient</code>.</p>\n"},{"id":"modulos","title":"Módulos y archivos","group":"Lenguaje DSL","summary":"Distribución del código en archivos y exportación de funciones.","html":"<h1>Módulos y archivos</h1>\n<h2>División de comandos</h2>\n<pre><code class=\"language-text\">commands/\n├── ping.pdiscord\n├── admin/\n│   └── ayuda.pd\n└── utilidades.pd\n</code></pre>\n<p><code>loadCommands('./commands')</code> carga los archivos del directorio, incluidos los directorios anidados.</p>\n<h2>Exportar una función</h2>\n<p>Archivo <code>shared/util.pd</code>:</p>\n<pre><code class=\"language-text\">EXPORTAR FUNCION doble(numero)\n    RETORNAR numero * 2\nFIN FUNCION\n</code></pre>\n<h2>Importar</h2>\n<pre><code class=\"language-text\">IMPORTAR &quot;./shared/util.pd&quot; COMO util\n\nCOMANDO BARRA &quot;calculo&quot; DESCRIPCION &quot;Ejecuta una función&quot;\n    RESPONDER &quot;{util.doble(8)}&quot;\nFIN COMANDO\n</code></pre>\n<p>Los imports utilizan rutas que deben resolverse dentro del proyecto. Los patrones de carpeta pueden utilizarse en los escenarios admitidos por el cargador.</p>\n<h2>Inicialización</h2>\n<pre><code class=\"language-text\">AL PREPARAR\n    IMPRIMIR &quot;Preparación finalizada&quot;\nFIN PREPARAR\n</code></pre>\n<p>La carga de archivos y las tareas de inicio se preparan antes de registrar los comandos en Discord.</p>\n"},{"id":"tareas","title":"Tareas programadas","group":"Lenguaje DSL","summary":"Tareas repetitivas, expresiones cron y zonas horarias.","html":"<h1>Tareas programadas</h1>\n<p>Las declaraciones <code>CADA</code> y <code>TAREA</code> permiten definir ejecuciones temporizadas.</p>\n<h2>Configuración de zona horaria</h2>\n<pre><code class=\"language-javascript\">const bot = new PseudoClient({\n  token: process.env.DISCORD_TOKEN,\n  schedulerTimeZone: 'America/Asuncion'\n});\n</code></pre>\n<h2>Ejecución periódica</h2>\n<p>La declaración <code>CADA</code> repite las instrucciones mientras el bot permanece activo.</p>\n<pre><code class=\"language-text\">CADA &quot;10m&quot;\n    IMPRIMIR &quot;Comprobación programada&quot;\nFIN CADA\n</code></pre>\n<h2>Tareas identificadas</h2>\n<p>La declaración <code>TAREA</code> admite intervalos (<code>CADA</code>), horas (<code>A_LAS</code>) y calendarios (<code>CRON</code>).</p>\n<pre><code class=\"language-text\">TAREA &quot;informe&quot; CRON &quot;0 9 * * 1&quot;\n    IMPRIMIR &quot;Informe semanal&quot;\nFIN TAREA\n</code></pre>\n<h2>Expresiones cron</h2>\n<p>Las expresiones cron admitidas utilizan cinco campos: minuto, hora, día del mes, mes y día de la semana.</p>\n<pre><code class=\"language-text\">0 9 * * 1\n</code></pre>\n<p>Este patrón corresponde a los lunes a las 09:00 de la zona configurada.</p>\n<h2>Consideraciones</h2>\n<ul>\n<li>Las tareas se ejecutan mientras el bot permanezca en ejecución.</li>\n<li>Las zonas horarias deben ser identificadores IANA válidos.</li>\n<li>Un servidor reiniciado o desconectado puede interrumpir ejecuciones programadas.</li>\n<li>Las tareas no equivalen a un servicio externo de trabajos persistentes.</li>\n</ul>\n"},{"id":"persistencia","title":"Persistencia","group":"Integraciones","summary":"Funciones de almacenamiento por usuario, servidor y global.","html":"<h1>Persistencia</h1>\n<p><code>PseudoClient.database</code> configura un proveedor de almacenamiento. Las operaciones <code>OBTENER_*</code>, <code>GUARDAR_*</code>, <code>BORRAR_*</code> e <code>INCREMENTAR_*</code> permiten mantener datos entre reinicios.</p>\n<h2>SQLite</h2>\n<pre><code class=\"language-javascript\">const bot = new PseudoClient({\n  token: process.env.DISCORD_TOKEN,\n  database: {\n    provider: 'sqlite',\n    namespace: 'servidor-demo',\n    sqliteFile: './data/bot.sqlite'\n  }\n});\n</code></pre>\n<h2>Guardar una preferencia</h2>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;tema&quot; DESCRIPCION &quot;Guarda el tema del perfil&quot;\n    GUARDAR_USUARIO(contexto.usuario, &quot;tema&quot;, &quot;oscuro&quot;)\n    RESPONDER &quot;Preferencia guardada&quot;\nFIN COMANDO\n</code></pre>\n<h2>Consultar una preferencia</h2>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;mi-tema&quot; DESCRIPCION &quot;Consulta tu tema&quot;\n    VARIABLE tema = OBTENER_USUARIO(contexto.usuario, &quot;tema&quot;)\n    RESPONDER &quot;Tema: {coalescer(tema, 'sin configurar')}&quot;\nFIN COMANDO\n</code></pre>\n<h2>Ámbitos</h2>\n<table>\n<thead>\n<tr>\n<th>Ámbito</th>\n<th>Funciones</th>\n<th>Identificador</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Usuario</td>\n<td><code>*_USUARIO</code></td>\n<td>Usuario o ID</td>\n</tr>\n<tr>\n<td>Servidor</td>\n<td><code>*_SERVIDOR</code></td>\n<td>Servidor o ID</td>\n</tr>\n<tr>\n<td>Global</td>\n<td><code>*_GLOBAL</code></td>\n<td>No requiere identificador de propietario</td>\n</tr>\n</tbody>\n</table>\n<p>Las operaciones <code>INCREMENTAR_*</code> son adecuadas para contadores. Los valores persistentes deben ser compatibles con JSON. Para ver cada variante, consultar <a href=\"#/reference/storage\">Persistencia en la referencia</a>.</p>\n"},{"id":"http","title":"HTTP y servicios externos","group":"Integraciones","summary":"Solicitudes HTTPS desde pseudocódigo.","html":"<h1>HTTP y servicios externos</h1>\n<p>Las funciones <code>HTTP_SOLICITAR()</code> y <code>HTTP_JSON()</code> permiten consultar servicios HTTPS públicos.</p>\n<h2>Solicitud JSON</h2>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;estado-api&quot; DESCRIPCION &quot;Consulta una API&quot;\n    VARIABLE datos = HTTP_JSON(&quot;https://example.com/api/status&quot;)\n    RESPONDER &quot;Consulta completada&quot;\nFIN COMANDO\n</code></pre>\n<p>Sustituir el dominio de ejemplo por una API real accesible. La consulta puede fallar por red, permisos o respuesta inválida.</p>\n<h2>Respuesta estructurada</h2>\n<pre><code class=\"language-text\">VARIABLE respuesta = HTTP_SOLICITAR(&quot;https://example.com&quot;)\nVARIABLE codigo = HTTP_ESTADO(respuesta)\nVARIABLE tipo = HTTP_CABECERA(respuesta, &quot;content-type&quot;)\n</code></pre>\n<h2>Validaciones</h2>\n<pre><code class=\"language-text\">VARIABLE admitida = VALIDAR_URL(&quot;https://example.com&quot;)\nVARIABLE escapado = CODIFICAR_HTML(&quot;&lt;texto&gt;&quot;)\n</code></pre>\n<p>Las solicitudes HTTP están limitadas a destinos HTTPS permitidos, con restricciones de tamaño y tiempo. Las URLs privadas, locales o incompatibles pueden ser rechazadas.</p>\n<p>Consultar <a href=\"#/reference/http\">Solicitudes HTTP</a> para el catálogo de funciones.</p>\n"},{"id":"plugins","title":"Plugins JavaScript","group":"Integraciones","summary":"Extender el lenguaje mediante funciones y servicios JavaScript.","html":"<h1>Plugins JavaScript</h1>\n<p>Los plugins pueden incorporar funciones DSL y servicios compartidos. La configuración actual utiliza una lista de rutas o especificadores de módulos mediante <code>PseudoClient.plugins</code>.</p>\n<h2>Estructura</h2>\n<pre><code class=\"language-text\">mi-bot/\n├── bot.mjs\n└── plugins/\n    └── calculos.mjs\n</code></pre>\n<h2>Plugin básico</h2>\n<p>Archivo <code>plugins/calculos.mjs</code>:</p>\n<pre><code class=\"language-javascript\">export default {\n  name: 'calculos',\n  version: '1.0.0',\n\n  setup(api) {\n    api.functions.register('DOBLE', (valor) =&gt; Number(valor) * 2);\n  },\n\n  dispose() {\n    // Liberación opcional de recursos.\n  }\n};\n</code></pre>\n<h2>Cargar el plugin</h2>\n<pre><code class=\"language-javascript\">const bot = new PseudoClient({\n  token: process.env.DISCORD_TOKEN,\n  plugins: ['./plugins/calculos.mjs']\n});\n\nbot.loadCommands('./commands');\nawait bot.start();\n</code></pre>\n<h2>Utilizar una función</h2>\n<pre><code class=\"language-text\">COMANDO BARRA &quot;doble&quot; DESCRIPCION &quot;Calcula un doble&quot;\n    OPCION numero TIPO numero DESCRIPCION &quot;Número&quot; REQUERIDO\n    RESPONDER &quot;{DOBLE(argumentos.numero)}&quot;\nFIN COMANDO\n</code></pre>\n<h2>Propiedades del plugin</h2>\n<table>\n<thead>\n<tr>\n<th>Propiedad</th>\n<th>Descripción</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>name</code></td>\n<td>Nombre único del plugin.</td>\n</tr>\n<tr>\n<td><code>version</code></td>\n<td>Versión SemVer.</td>\n</tr>\n<tr>\n<td><code>compatibility.core</code></td>\n<td>Rango de versiones de pseudocord.js admitidas.</td>\n</tr>\n<tr>\n<td><code>compatibility.sdk</code></td>\n<td>Rango de SDK admitido.</td>\n</tr>\n<tr>\n<td><code>dependencies.plugins</code></td>\n<td>Plugins requeridos y versiones admitidas.</td>\n</tr>\n<tr>\n<td><code>setup(api)</code></td>\n<td>Inicialización y registro de capacidades.</td>\n</tr>\n<tr>\n<td><code>dispose(api)</code></td>\n<td>Limpieza opcional al finalizar.</td>\n</tr>\n</tbody>\n</table>\n<h2>API disponible durante setup</h2>\n<ul>\n<li><code>api.functions.register(nombre, callback)</code> registra una función DSL.</li>\n<li><code>api.services.register(nombre, version, valor)</code> ofrece un servicio.</li>\n<li><code>api.services.get(nombre, rango)</code> consume un servicio disponible.</li>\n<li><code>api.logger.info()</code>, <code>warn()</code> y <code>error()</code> permiten emitir registros.</li>\n</ul>\n<p>El gestor carga primero las dependencias requeridas y detecta dependencias circulares.</p>\n<blockquote>\n<p><strong>Seguridad:</strong> los plugins JavaScript tienen los permisos del proceso Node.js que los ejecuta. Utilizar únicamente código confiable.</p>\n</blockquote>\n"},{"id":"api-js","title":"API JavaScript","group":"Referencia de API","summary":"Métodos y propiedades públicas de PseudoClient.","html":"<h1>API JavaScript</h1>\n<p>La entrada pública del paquete es <code>PseudoClient</code>.</p>\n<h2>Constructor</h2>\n<pre><code class=\"language-javascript\">const bot = new PseudoClient({\n  token: process.env.DISCORD_TOKEN,\n  commands: { sync: 'manual' }\n});\n</code></pre>\n<h2>Métodos públicos</h2>\n<table>\n<thead>\n<tr>\n<th>Método</th>\n<th>Descripción</th>\n<th>Ejemplo</th>\n<th>Caso de uso</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>loadCommands(ruta)</code></td>\n<td>Incorpora archivos <code>.pd</code> o <code>.pdiscord</code> para la carga.</td>\n<td><code>bot.loadCommands('./commands')</code></td>\n<td>Organizar comandos en archivos y carpetas.</td>\n</tr>\n<tr>\n<td><code>command(codigo)</code></td>\n<td>Agrega una declaración DSL desde una cadena o un objeto <code>CommandSource</code>.</td>\n<td><code>bot.command({code: codigo})</code></td>\n<td>Registrar comandos generados desde JavaScript.</td>\n</tr>\n<tr>\n<td><code>compile()</code></td>\n<td>Valida y prepara las declaraciones sin conectarse al Gateway.</td>\n<td><code>await bot.compile()</code></td>\n<td>Detectar errores antes de iniciar la sesión.</td>\n</tr>\n<tr>\n<td><code>start()</code></td>\n<td>Inicia el bot y su conexión con Discord.</td>\n<td><code>await bot.start()</code></td>\n<td>Poner el bot en funcionamiento.</td>\n</tr>\n<tr>\n<td><code>syncCommands(opciones?)</code></td>\n<td>Sincroniza comandos después de iniciar.</td>\n<td><code>await bot.syncCommands({force: true})</code></td>\n<td>Publicar cambios manualmente en Discord.</td>\n</tr>\n<tr>\n<td><code>stop()</code></td>\n<td>Detiene el bot y libera recursos.</td>\n<td><code>await bot.stop()</code></td>\n<td>Apagar el bot de forma controlada.</td>\n</tr>\n<tr>\n<td><code>on(evento, callback)</code></td>\n<td>Registra un listener de Discord.</td>\n<td><code>bot.on('messageCreate', fn)</code></td>\n<td>Reaccionar a mensajes y eventos del cliente.</td>\n</tr>\n<tr>\n<td><code>once(evento, callback)</code></td>\n<td>Registra un listener de una sola ejecución.</td>\n<td><code>bot.once('clientReady', fn)</code></td>\n<td>Ejecutar una acción al entrar en estado disponible.</td>\n</tr>\n<tr>\n<td><code>off(evento, callback)</code></td>\n<td>Retira un listener previamente registrado.</td>\n<td><code>bot.off('messageCreate', fn)</code></td>\n<td>Dejar de procesar eventos específicos.</td>\n</tr>\n</tbody>\n</table>\n<h2>Propiedades públicas</h2>\n<table>\n<thead>\n<tr>\n<th>Propiedad</th>\n<th>Descripción</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>discord</code></td>\n<td>Acceso al cliente discord.js después de iniciarlo.</td>\n</tr>\n<tr>\n<td><code>user</code></td>\n<td>Usuario del cliente cuando esté disponible.</td>\n</tr>\n<tr>\n<td><code>diagnostics</code></td>\n<td>Diagnósticos obtenidos en la validación.</td>\n</tr>\n<tr>\n<td><code>isRunning</code></td>\n<td>Indica si el cliente está en ejecución.</td>\n</tr>\n</tbody>\n</table>\n<h2>Código DSL en memoria</h2>\n<pre><code class=\"language-javascript\">bot.command({\n  code: `COMANDO BARRA &quot;hola&quot; DESCRIPCION &quot;Saluda&quot;\n    RESPONDER &quot;Hola&quot;\n  FIN COMANDO`,\n  sourceName: 'hola-en-memoria'\n});\n</code></pre>\n<h2>Ciclo de vida</h2>\n<pre><code class=\"language-javascript\">bot.loadCommands('./commands');\nawait bot.start();\n\n// Cierre controlado cuando lo solicite la aplicación.\nawait bot.stop();\n</code></pre>\n<p><code>syncCommands()</code> requiere que el cliente esté iniciado. El registro de comandos debe realizarse antes de <code>start()</code>.</p>\n"},{"id":"diagnosticos","title":"Diagnósticos y problemas comunes","group":"Referencia de API","summary":"Interpretación de errores de sintaxis, permisos y configuración.","html":"<h1>Diagnósticos y problemas comunes</h1>\n<h2>Errores de sintaxis</h2>\n<p>Los errores suelen incluir nombre del archivo, línea, columna, identificador del diagnóstico y descripción del problema. Comprobar declaraciones <code>FIN</code>, nombres de instrucciones y delimitadores de cadenas.</p>\n<h2>Opciones ambiguas</h2>\n<p>Cuando una opción usa el nombre <code>usuario</code>, diferenciar explícitamente:</p>\n<pre><code class=\"language-text\">argumentos.usuario\ncontexto.usuario\n</code></pre>\n<h2>Comandos slash no visibles</h2>\n<ul>\n<li>Comprobar que el bot está instalado en el servidor con los ámbitos correctos.</li>\n<li>Verificar <code>commands.sync</code> y, en modo <code>manual</code>, ejecutar <code>syncCommands()</code>.</li>\n<li>Comprobar si <code>guildId</code> corresponde al servidor esperado.</li>\n<li>Considerar el tiempo de propagación de comandos globales.</li>\n</ul>\n<h2>Permisos insuficientes</h2>\n<p>Las acciones administrativas y las consultas de auditoría requieren permisos del bot y del ejecutor. La jerarquía de roles también puede impedir una operación.</p>\n<h2>Funciones de persistencia no disponibles</h2>\n<p>Configurar <code>database</code> mediante <code>PseudoClient</code> y comprobar los datos de conexión.</p>\n<h2>Fallos de plugins</h2>\n<p>Comprobar el nombre, versión SemVer, dependencias requeridas y ruta del plugin. El código JavaScript de terceros se ejecuta con los permisos del proceso.</p>\n<h2>Compatibilidad</h2>\n<p>La versión alpha puede modificar APIs y sintaxis antes de la versión estable. Los nombres marcados como obsoletos deben sustituirse por sus equivalentes recomendados.</p>\n"}],"functions":[{"name":"capitalizar","group":"text","description":"Convierte en mayúscula la letra inicial de cada palabra.","example":"capitalizar(\"hola mundo\")","case":"Presentar nombres o títulos breves.","status":"supported","preferred":null},{"name":"caracter","group":"text","description":"Obtiene el carácter de una cadena en una posición indicada.","example":"caracter(\"bot\", 0)","case":"Inspeccionar un carácter de un identificador.","status":"supported","preferred":null},{"name":"contiene","group":"text","description":"Comprueba si una cadena o colección contiene el valor indicado.","example":"contiene(\"pseudocord\", \"cord\")","case":"Buscar una palabra dentro de un mensaje.","status":"supported","preferred":null},{"name":"dividir","group":"text","description":"Divide un texto en una lista usando un separador.","example":"dividir(\"uno,dos,tres\", \",\")","case":"Procesar opciones separadas por comas.","status":"supported","preferred":null},{"name":"empiezaCon","group":"text","description":"Comprueba si un texto comienza por un fragmento determinado.","example":"empiezaCon(\"!ayuda\", \"!\")","case":"Reconocer el prefijo de un comando.","status":"supported","preferred":null},{"name":"indiceDe","group":"text","description":"Busca la primera posición de un fragmento dentro del texto.","example":"indiceDe(\"hola mundo\", \"mundo\")","case":"Ubicar una palabra dentro de una descripción.","status":"supported","preferred":null},{"name":"invertirTexto","group":"text","description":"Devuelve un texto con los caracteres en orden inverso.","example":"invertirTexto(\"abc\")","case":"Transformaciones sencillas de cadenas.","status":"supported","preferred":null},{"name":"longitud","group":"text","description":"Obtiene la cantidad de caracteres, elementos o propiedades de un valor.","example":"longitud(\"Hola\")","case":"Comprobar el tamaño de un texto antes de enviarlo.","status":"supported","preferred":null},{"name":"mayusculas","group":"text","description":"Convierte todos los caracteres de texto a mayúsculas.","example":"mayusculas(\"hola\")","case":"Normalizar una etiqueta para mostrarla.","status":"supported","preferred":null},{"name":"minusculas","group":"text","description":"Convierte los caracteres de un texto a minúsculas.","example":"minusculas(\"HOLA\")","case":"Comparar búsquedas sin distinguir mayúsculas.","status":"supported","preferred":null},{"name":"recortar","group":"text","description":"Elimina los espacios iniciales y finales del texto.","example":"recortar(\"  Hola  \")","case":"Limpiar datos introducidos por usuarios.","status":"supported","preferred":null},{"name":"recortarFin","group":"text","description":"Elimina los espacios al final de un texto.","example":"recortarFin(\"canal   \")","case":"Eliminar espacios sobrantes del contenido.","status":"supported","preferred":null},{"name":"recortarInicio","group":"text","description":"Elimina los espacios al comienzo de un texto.","example":"recortarInicio(\"   canal\")","case":"Conservar espacios finales sin afectar la entrada.","status":"supported","preferred":null},{"name":"reemplazar","group":"text","description":"Sustituye la primera coincidencia de un texto o patrón.","example":"reemplazar(\"hola hola\", \"hola\", \"adiós\")","case":"Corregir una aparición concreta en un mensaje.","status":"supported","preferred":null},{"name":"reemplazarTodo","group":"text","description":"Sustituye todas las coincidencias de un fragmento.","example":"reemplazarTodo(\"a-a-a\", \"-\", \"/\")","case":"Normalizar separadores en cadenas.","status":"supported","preferred":null},{"name":"subtexto","group":"text","description":"Extrae una parte del texto desde una posición y con longitud opcional.","example":"subtexto(\"pseudocord\", 0, 6)","case":"Obtener una vista previa de una cadena.","status":"supported","preferred":null},{"name":"terminaCon","group":"text","description":"Comprueba si un texto termina con un fragmento indicado.","example":"terminaCon(\"foto.png\", \".png\")","case":"Reconocer la extensión de un archivo.","status":"supported","preferred":null},{"name":"ultimoIndiceDe","group":"text","description":"Busca la última posición de un fragmento dentro del texto.","example":"ultimoIndiceDe(\"a.b.c\", \".\")","case":"Localizar el último separador de una ruta.","status":"supported","preferred":null},{"name":"unir","group":"text","description":"Une los elementos de una colección en una cadena.","example":"unir([\"uno\", \"dos\"], \", \")","case":"Crear una lista legible de valores.","status":"supported","preferred":null},{"name":"abs","group":"mathematics","description":"Obtiene el valor absoluto de un número.","example":"abs(-12)","case":"Calcular una distancia sin signo.","status":"supported","preferred":null},{"name":"acos","group":"mathematics","description":"Calcula el arcocoseno y devuelve un ángulo en radianes.","example":"acos(0.5)","case":"Obtener un ángulo desde una razón de coseno.","status":"supported","preferred":null},{"name":"asin","group":"mathematics","description":"Calcula el arcoseno y devuelve un ángulo en radianes.","example":"asin(0.5)","case":"Obtener un ángulo desde una razón de seno.","status":"supported","preferred":null},{"name":"atan","group":"mathematics","description":"Calcula el arcotangente de un número.","example":"atan(1)","case":"Convertir una pendiente en ángulo.","status":"supported","preferred":null},{"name":"atan2","group":"mathematics","description":"Calcula el ángulo a partir de dos componentes.","example":"atan2(1, 1)","case":"Orientar un vector bidimensional.","status":"supported","preferred":null},{"name":"cbrt","group":"mathematics","description":"Calcula la raíz cúbica de un número.","example":"cbrt(27)","case":"Calcular el lado de un cubo a partir de su volumen.","status":"supported","preferred":null},{"name":"cos","group":"mathematics","description":"Calcula el coseno de un ángulo en radianes.","example":"cos(radianes(60))","case":"Obtener una componente angular.","status":"supported","preferred":null},{"name":"esFinito","group":"mathematics","description":"Comprueba si un número es finito.","example":"esFinito(25)","case":"Descartar valores numéricos infinitos.","status":"supported","preferred":null},{"name":"esNaN","group":"mathematics","description":"Comprueba si un valor es NaN.","example":"esNaN(0 / 0)","case":"Detectar cálculos que no produjeron un número válido.","status":"supported","preferred":null},{"name":"exp","group":"mathematics","description":"Calcula la exponencial natural de un valor.","example":"exp(1)","case":"Aplicar fórmulas exponenciales.","status":"supported","preferred":null},{"name":"grados","group":"mathematics","description":"Convierte un ángulo de radianes a grados.","example":"grados(3.141592653589793)","case":"Mostrar ángulos en grados.","status":"supported","preferred":null},{"name":"hipot","group":"mathematics","description":"Calcula la hipotenusa o magnitud euclidiana.","example":"hipot(3, 4)","case":"Calcular distancias en un plano.","status":"supported","preferred":null},{"name":"interpolar","group":"mathematics","description":"Interpola linealmente entre dos valores.","example":"interpolar(0, 100, 0.5)","case":"Calcular un valor intermedio.","status":"supported","preferred":null},{"name":"limitar","group":"mathematics","description":"Restringe un valor al intervalo mínimo y máximo.","example":"limitar(140, 0, 100)","case":"Aplicar un límite a porcentajes.","status":"supported","preferred":null},{"name":"ln","group":"mathematics","description":"Calcula el logaritmo natural.","example":"ln(10)","case":"Transformar valores en escala logarítmica.","status":"supported","preferred":null},{"name":"log10","group":"mathematics","description":"Calcula el logaritmo decimal.","example":"log10(1000)","case":"Determinar el orden de magnitud de un valor.","status":"supported","preferred":null},{"name":"log2","group":"mathematics","description":"Calcula el logaritmo en base dos.","example":"log2(1024)","case":"Medir tamaños en potencias de dos.","status":"supported","preferred":null},{"name":"max","group":"mathematics","description":"Devuelve el mayor valor entre los números proporcionados.","example":"max(3, 7, 2)","case":"Determinar el mayor puntaje.","status":"supported","preferred":null},{"name":"min","group":"mathematics","description":"Devuelve el menor valor entre los números proporcionados.","example":"min(3, 7, 2)","case":"Seleccionar el límite más bajo.","status":"supported","preferred":null},{"name":"piso","group":"mathematics","description":"Redondea un número hacia abajo.","example":"piso(3.9)","case":"Calcular páginas completas de resultados.","status":"supported","preferred":null},{"name":"potencia","group":"mathematics","description":"Eleva una base a un exponente.","example":"potencia(2, 8)","case":"Calcular crecimiento exponencial.","status":"supported","preferred":null},{"name":"radianes","group":"mathematics","description":"Convierte un ángulo de grados a radianes.","example":"radianes(180)","case":"Preparar datos para trigonometría.","status":"supported","preferred":null},{"name":"redondear","group":"mathematics","description":"Redondea un número al entero más próximo.","example":"redondear(4.6)","case":"Mostrar cantidades sin decimales.","status":"supported","preferred":null},{"name":"signo","group":"mathematics","description":"Devuelve el signo de un número.","example":"signo(-7)","case":"Identificar una variación positiva o negativa.","status":"supported","preferred":null},{"name":"sin","group":"mathematics","description":"Calcula el seno de un ángulo en radianes.","example":"sin(radianes(30))","case":"Resolver cálculos trigonométricos.","status":"supported","preferred":null},{"name":"sqrt","group":"mathematics","description":"Calcula la raíz cuadrada de un número.","example":"sqrt(81)","case":"Calcular una raíz matemática.","status":"supported","preferred":null},{"name":"tan","group":"mathematics","description":"Calcula la tangente de un ángulo en radianes.","example":"tan(radianes(45))","case":"Calcular relaciones trigonométricas.","status":"supported","preferred":null},{"name":"techo","group":"mathematics","description":"Redondea un número hacia arriba.","example":"techo(3.1)","case":"Calcular el número de páginas necesarias.","status":"supported","preferred":null},{"name":"truncar","group":"mathematics","description":"Descarta la parte fraccionaria de un número.","example":"truncar(8.9)","case":"Convertir una cantidad decimal a parte entera.","status":"supported","preferred":null},{"name":"aleatorio","group":"randomization","description":"Obtiene un valor aleatorio.","example":"aleatorio()","case":"Introducir variaciones en un resultado.","status":"supported","preferred":null},{"name":"barajar","group":"randomization","description":"Mezcla aleatoriamente el orden de una colección.","example":"barajar([1, 2, 3, 4])","case":"Mezclar participantes de un sorteo.","status":"supported","preferred":null},{"name":"elegir","group":"randomization","description":"Elige un elemento al azar de una colección.","example":"elegir([\"rojo\", \"verde\", \"azul\"])","case":"Elegir una recompensa aleatoria.","status":"supported","preferred":null},{"name":"enteroAleatorio","group":"randomization","description":"Obtiene un número entero aleatorio dentro de los límites indicados.","example":"enteroAleatorio(1, 6)","case":"Simular el lanzamiento de un dado.","status":"supported","preferred":null},{"name":"uuid","group":"randomization","description":"Genera un identificador UUID.","example":"uuid()","case":"Asignar un identificador a una tarea.","status":"supported","preferred":null},{"name":"agregar","group":"collections","description":"Añade uno o más elementos al final de una lista.","example":"agregar([1, 2], 3)","case":"Agregar un elemento a una cola.","status":"supported","preferred":null},{"name":"agregarInicio","group":"collections","description":"Inserta elementos al principio de una lista.","example":"agregarInicio([2, 3], 1)","case":"Priorizar elementos de una lista.","status":"supported","preferred":null},{"name":"alguno","group":"collections","description":"Comprueba si al menos un elemento cumple la condición.","example":"alguno([1, 2, 3], mayorDos)","case":"Determinar si existe algún valor aceptado.","status":"supported","preferred":null},{"name":"aplanar","group":"collections","description":"Reduce el anidamiento de una colección.","example":"aplanar([[1, 2], [3]])","case":"Combinar listas anidadas.","status":"supported","preferred":null},{"name":"buscar","group":"collections","description":"Devuelve el primer elemento que cumple una condición.","example":"buscar([1, 2, 3], mayorDos)","case":"Encontrar el primer resultado válido.","status":"supported","preferred":null},{"name":"buscarIndice","group":"collections","description":"Devuelve el índice del primer elemento que cumple una condición.","example":"buscarIndice([1, 2, 3], mayorDos)","case":"Localizar un elemento mediante una condición.","status":"supported","preferred":null},{"name":"claves","group":"collections","description":"Devuelve las claves de un mapa u objeto.","example":"claves({a: 1, b: 2})","case":"Recorrer nombres de propiedades.","status":"supported","preferred":null},{"name":"contar","group":"collections","description":"Cuenta elementos; acepta una función de filtrado opcional.","example":"contar([1, 2, 3, 4])","case":"Mostrar el número de resultados.","status":"supported","preferred":null},{"name":"entradas","group":"collections","description":"Devuelve pares de clave y valor de una estructura.","example":"entradas({a: 1, b: 2})","case":"Recorrer un mapa con claves y valores.","status":"supported","preferred":null},{"name":"extraerPrimero","group":"collections","description":"Quita y devuelve el primer elemento de una lista.","example":"extraerPrimero([1, 2, 3])","case":"Consumir el primer elemento de una cola.","status":"supported","preferred":null},{"name":"extraerUltimo","group":"collections","description":"Quita y devuelve el último elemento de una lista.","example":"extraerUltimo([1, 2, 3])","case":"Retirar un elemento de una pila.","status":"supported","preferred":null},{"name":"filtrar","group":"collections","description":"Conserva los elementos que cumplen una condición.","example":"filtrar([1, 2, 3, 4], esPar)","case":"Filtrar una lista con una función del DSL.","status":"supported","preferred":null},{"name":"insertar","group":"collections","description":"Inserta un valor en una posición indicada.","example":"insertar([\"a\", \"c\"], 1, \"b\")","case":"Reordenar una lista.","status":"supported","preferred":null},{"name":"invertir","group":"collections","description":"Invierte el orden de los elementos.","example":"invertir([1, 2, 3])","case":"Mostrar primero los datos más recientes.","status":"supported","preferred":null},{"name":"mapear","group":"collections","description":"Transforma cada elemento mediante una función.","example":"mapear([1, 2, 3], doble)","case":"Convertir valores con una función definida en el DSL.","status":"supported","preferred":null},{"name":"obtener","group":"collections","description":"Recupera una propiedad, clave o elemento.","example":"obtener({nombre: \"Ada\"}, \"nombre\")","case":"Leer un atributo sin acceder directamente al objeto.","status":"supported","preferred":null},{"name":"ordenar","group":"coll
