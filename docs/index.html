<script>
(()=>{'use strict';
const DATA=window.PSEUDOCORD_DOCS;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const content=$('#content'), nav=$('#sidebar-nav'), toc=$('#toc'), breadcrumb=$('#breadcrumb');
const searchDialog=$('#search-dialog'),searchInput=$('#search-input'),searchResults=$('#search-results');
const groupKeys=Object.keys(DATA.groups), functions=DATA.functions, guides=DATA.guides;
const guideMap=new Map(guides.map(x=>[x.id,x]));
const byName=new Map(functions.map(x=>[x.name,x]));
const groups=DATA.groups;
const iconNames=['⌘','01','ƒ','◇','∑','∴','▤','◈','⇄','▣','⌁','⟳','○','☰','⬡','↗','⚙','◫','⋯'];
let currentRoute='',searchHits=[],selectedSearch=0;
const escapeHTML=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=(s)=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const norm=(s)=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const linkGuide=(g)=>`#/guide/${encodeURIComponent(g.id)}`;
const linkCategory=(key)=>`#/reference/${encodeURIComponent(key)}`;
const linkFunction=(f)=>`#/reference/${encodeURIComponent(f.group)}/${encodeURIComponent(f.name)}`;
const count=(key)=>functions.filter(x=>x.group===key).length;
const tags=(f)=>f.status==='deprecated'||f.status==='deprecated_alias'?'<span class="tag deprecated">OBSOLETA</span>':f.status==='canonical'?'<span class="tag canonical">CANÓNICA</span>':'';
const guideSections=[['Comenzar',['inicio','instalacion','primer-bot','configuracion']],['Lenguaje DSL',['comandos','argumentos','eventos','interacciones','lenguaje','flujo','modulos','tareas']],['Integraciones',['persistencia','http','plugins']],['API',['api-js','diagnosticos']]];
const navIcons={'inicio':'⌂','instalacion':'↓','primer-bot':'▶','configuracion':'⚙','comandos':'/','argumentos':'◇','eventos':'◉','interacciones':'▦','lenguaje':'{}','flujo':'⟳','modulos':'▤','tareas':'◷','persistencia':'▥','http':'↗','plugins':'⬡','api-js':'⌘','diagnosticos':'!'};
function routeParts(){return (location.hash||'#/guide/inicio').replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent)}
function sidebar(){
 let s='';
 for(const [title,ids] of guideSections){
  s+=`<section class="nav-section"><div class="nav-label">${escapeHTML(title)}</div>`;
  for(const id of ids){const g=guideMap.get(id);if(!g)continue;
   s+=`<a class="nav-item" data-route="${escapeHTML('guide/'+id)}" href="${linkGuide(g)}"><span class="nav-icon">${navIcons[id]||'·'}</span><span>${escapeHTML(g.title)}</span></a>`;
  }
  s+='</section>';
 }
 s+='<section class="nav-section"><div class="nav-label">Referencia de funciones</div>';
 s+='<a class="nav-item" data-route="reference" href="#/reference"><span class="nav-icon">⌕</span>Catálogo completo<span class="nav-number">'+functions.length+'</span></a>';
 groupKeys.forEach((key,i)=>{s+=`<a class="nav-item" data-route="reference/${key}" href="${linkCategory(key)}"><span class="nav-icon">${iconNames[i%iconNames.length]}</span><span>${escapeHTML(groups[key].title)}</span><span class="nav-number">${count(key)}</span></a>`});
 s+='</section>';nav.innerHTML=s;
}
function activeNav(parts){
 const p=parts.join('/');
 $$('.nav-item',nav).forEach(el=>el.classList.toggle('active',el.dataset.route===p||(parts[0]==='reference'&&parts.length>=3&&el.dataset.route===`reference/${parts[1]}`)));
 const active=$('.nav-item.active',nav);if(active&&active.getBoundingClientRect().top<115)active.scrollIntoView({block:'nearest'});
}
function setBread(...crumbs){breadcrumb.innerHTML='<span>Documentación</span>'+crumbs.map(x=>`<span class="crumb-divider">/</span><span>${escapeHTML(x)}</span>`).join('')}
function eyebrow(s){return `<div class="section-eyebrow"><span class="line"></span>${escapeHTML(s)}</div>`}
function title(s,lead,section){return `${eyebrow(section)}<h1 class="page-title">${escapeHTML(s)}</h1>${lead?`<p class="lead">${escapeHTML(lead)}</p>`:''}`}
function landing(){
 const cards=[['primer-bot','▶','Primer bot','Instalación y primer comando slash paso a paso.'],['configuracion','⚙','Configuración','Opciones, sincronización, intents y presencia.'],['comandos','/','Sintaxis de comandos','Slash, prefijos, argumentos y permisos.'],['plugins','⬡','Plugins JavaScript','Funciones DSL y servicios compartidos.'],['api-js','⌘','Referencia JavaScript','Métodos y propiedades de PseudoClient.'],['persistencia','▥','Persistencia','Datos por usuario, servidor y global.']];
 const tiles=cards.map(([id,icon,name,desc])=>`<a href="#/guide/${id}" class="landing-card"><span class="arrow">↗</span><span class="tile-icon">${icon}</span><strong>${escapeHTML(name)}</strong><span class="desc">${escapeHTML(desc)}</span></a>`).join('');
 const home=guideMap.get('inicio');
 return `<article class="article"><section class="hero"><div class="hero-version">v${escapeHTML(DATA.meta.version)} · ALPHA</div><h1>Construye bots.<br><em>Escribe en español.</em></h1><p>La referencia de pseudocord.js: comandos de Discord, sintaxis del lenguaje, funciones, integraciones y ejemplos de uso.</p><div class="hero-actions"><a class="btn primary" href="#/guide/primer-bot">Empezar →</a><a class="btn" href="#/reference">Explorar funciones ↗</a></div><p class="hero-micro">Node.js ≥ 22.13 · Pseudocódigo .pd / .pdiscord · Documentación alpha</p></section><section class="metric-row"><div class="metric"><strong>${functions.length}</strong><span>Funciones y variantes</span></div><div class="metric"><strong>${groupKeys.length}</strong><span>Categorías de referencia</span></div><div class="metric"><strong>${guides.length}</strong><span>Guías de desarrollo</span></div></section><h2 class="landing-section-title">Explorar documentación</h2><div class="landing-grid">${tiles}</div><h2 class="landing-section-title">Inicio rápido</h2><div class="prose">${home.html.replace(/<h1[^>]*>.*?<\/h1>/s,'')}</div></article>`
}
function guidePage(g){return `<article class="article">${title(g.title,g.summary,g.group)}<div class="prose">${g.html}</div>${guideNext(g)}</article>`}
function guideNext(g){const i=guides.findIndex(x=>x.id===g.id);const next=guides[i+1];const prev=guides[i-1];return `<div class="next-row">${prev?`<a href="${linkGuide(prev)}" class="next-card"><small>← Anterior</small><strong>${escapeHTML(prev.title)}</strong></a>`:''}${next?`<a href="${linkGuide(next)}" class="next-card"><small>Siguiente →</small><strong>${escapeHTML(next.title)}</strong></a>`:''}</div>`}
function categoryCard(key,i){const g=groups[key];return `<a class="category-card" href="${linkCategory(key)}"><span class="category-icon">${iconNames[i%iconNames.length]}</span><span><strong>${escapeHTML(g.title)}</strong><small>${escapeHTML(g.summary)}</small></span><span class="count">${count(key)}</span></a>`}
function referenceIndex(){return `<article class="article">${title('Referencia de funciones',`Consulta de ${functions.length} funciones públicas y variantes de compatibilidad, organizadas por categoría. Cada ficha incluye una explicación y un ejemplo de uso.`,'Catálogo del lenguaje')}<div class="ref-toolbar"><input type="search" id="local-filter" placeholder="Filtrar categorías o funciones…" autocomplete="off" aria-label="Filtrar funciones"><span class="ref-count">${functions.length} entradas</span></div><div id="ref-grid" class="category-grid">${groupKeys.map(categoryCard).join('')}</div><h2 class="landing-section-title">Índice alfabético</h2><div id="ref-list" class="function-list">${functions.slice(0,50).map(functionRow).join('')}</div><p class="lead" id="ref-bottom-hint">Mostrando las primeras 50 funciones. Utiliza el filtro para localizar una función concreta.</p></article>`}
function functionRow(f){return `<a class="function-item" href="${linkFunction(f)}"><span><span class="function-name">${escapeHTML(f.name)}</span>${tags(f)}<span class="function-desc">${escapeHTML(f.description)}</span></span><span class="function-arrow">↗</span></a>`}
function groupPage(key){const g=groups[key];const items=functions.filter(x=>x.group===key);return `<article class="article"><a class="back-link" href="#/reference">← Todas las categorías</a>${title(g.title,g.summary,'Referencia · '+items.length+' funciones')}<div class="ref-toolbar"><input type="search" id="group-filter" placeholder="Buscar en ${escapeHTML(g.title)}…" autocomplete="off" aria-label="Buscar en esta categoría"><span id="group-count" class="ref-count">${items.length} funciones</span></div><div class="filter-pills"><button class="filter-pill active" type="button" data-status="all">Todas</button><button class="filter-pill" type="button" data-status="current">Actuales</button><button class="filter-pill" type="button" data-status="deprecated">Obsoletas</button></div><div class="function-list" id="group-list">${items.map(functionRow).join('')}</div></article>`}
function functionPage(f){
 const related=functions.filter(x=>x.group===f.group); const pos=related.indexOf(f);const prev=related[pos-1],next=related[pos+1];
 const preferred=f.preferred&&byName.has(f.preferred)?byName.get(f.preferred):null;
 const safeEx=escapeHTML(f.example);
 const code=`<div class="code-block"><div class="code-caption"><span>pseudocord DSL · expresión</span><button class="copy-code" type="button">Copiar</button></div><pre><code class="language-pdiscord">${safeEx}</code></pre></div>`;
 return `<article class="article"><a href="${linkCategory(f.group)}" class="back-link">← ${escapeHTML(groups[f.group].title)}</a><div class="function-header">${eyebrow('Referencia / '+groups[f.group].title)}<div class="title-line"><h1>${escapeHTML(f.name)}()</h1>${tags(f)}</div><p>${escapeHTML(f.description)}</p><div class="function-meta"><span class="meta-pill">Función del DSL</span><span class="meta-pill">${escapeHTML(groups[f.group].title)}</span>${f.status==='deprecated'||f.status==='deprecated_alias'?'<span class="meta-pill">Alias obsoleto</span>':''}</div></div><section class="fn-section"><h2>Descripción</h2><p>${escapeHTML(f.description)}</p></section><section class="fn-section"><h2>Ejemplo de uso</h2><p>Expresión de ejemplo para utilizar en un comando, función o bloque compatible del lenguaje.</p>${code}</section><section class="fn-section"><h2>Caso de uso</h2><div class="fn-case"><span class="case-icon">◇</span><div><strong>Aplicación práctica</strong><p>${escapeHTML(f.case)}</p></div></div></section>${preferred?`<section class="fn-section"><h2>Nombre recomendado</h2><p>Esta denominación se conserva por compatibilidad. En código nuevo se recomienda <a href="${linkFunction(preferred)}"><code>${escapeHTML(preferred.name)}()</code></a>.</p></section>`:''}<section class="fn-section"><h2>Consideraciones</h2><p>${f.group==='storage'?'Requiere configurar un proveedor mediante <code>database</code> y disponer de los datos del ámbito correspondiente.':(['discord_entities','discord_resources','runtime_utilities','discord_components','command_context'].includes(f.group)?'Su disponibilidad depende del contexto de ejecución y de los datos o permisos que Discord proporcione.':'El resultado depende del tipo y de los valores recibidos. Las entradas no válidas pueden producir un error de validación.')}</p></section><div class="next-row">${prev?`<a class="next-card" href="${linkFunction(prev)}"><small>← Anterior</small><strong>${escapeHTML(prev.name)}()</strong></a>`:''}${next?`<a class="next-card" href="${linkFunction(next)}"><small>Siguiente →</small><strong>${escapeHTML(next.name)}()</strong></a>`:''}</div></article>`
}
function notFound(){return `<article class="article">${title('Página no encontrada','La ruta solicitada no coincide con una guía o función publicada.','404')}<a class="btn primary" href="#/guide/inicio">Volver al inicio</a></article>`}
function decorateCode(){
 $$('.prose pre').forEach(pre=>{
  const c=$('code',pre);let l=[...c.classList].find(x=>x.startsWith('language-'))||'language-text';l=l.replace('language-','');
  const bar=document.createElement('div');bar.className='code-caption';
  const label=document.createElement('span');label.textContent=l==='javascript'?'JavaScript':l==='bash'?'Terminal':l==='json'?'JSON':'Pseudocódigo';
  const b=document.createElement('button');b.className='copy-code';b.textContent='Copiar';b.type='button';bar.append(label,b);pre.prepend(bar);
 });
}
function updateTOC(){
 const headings=$$('h2, h3',content).filter(x=>x.closest('.article')&&!x.classList.contains('landing-section-title'));
 if(!headings.length){toc.innerHTML='';return}
 toc.innerHTML='<div class="toc-label">EN ESTA PÁGINA</div>';
 headings.forEach((h,i)=>{const id=`section-${i}-${slug(h.textContent)}`;h.id=id;const btn=document.createElement('button');btn.className='toc-item '+(h.tagName==='H3'?'level3':'');btn.textContent=h.textContent;btn.onclick=()=>h.scrollIntoView({behavior:'smooth',block:'start'});toc.appendChild(btn)});
 const first=$('.toc-item',toc);if(first)first.classList.add('active');
}
function bindLocalFilters(parts){
 if(parts.length===1&&parts[0]==='reference'){
  const inp=$('#local-filter');if(!inp)return;
  inp.addEventListener('input',()=>{
   const q=norm(inp.value.trim());const filtered=functions.filter(f=>norm(f.name+' '+f.description+' '+groups[f.group].title).includes(q));
   $('#ref-grid').innerHTML=groupKeys.filter(k=>norm(groups[k].title+' '+groups[k].summary).includes(q)||functions.some(f=>f.group===k&&norm(f.name+' '+f.description).includes(q))).map(k=>categoryCard(k,groupKeys.indexOf(k))).join('');
   $('#ref-list').innerHTML=filtered.slice(0,q?100:50).map(functionRow).join('')||'<div class="empty-results"><strong>Sin resultados</strong><p>Prueba otro término o una categoría.</p></div>';
   $('.ref-count',content).textContent=filtered.length+' entradas';
   $('#ref-bottom-hint').textContent=filtered.length>100&&q?'Mostrando los primeros 100 resultados. Especifica un nombre más concreto.':!q?'Mostrando las primeras 50 funciones. Utiliza el filtro para localizar una función concreta.':'';
  });
 }
 if(parts[0]==='reference'&&parts.length===2){
   const key=parts[1];const inp=$('#group-filter');if(!inp)return;let status='all';
   const refresh=()=>{
    const q=norm(inp.value);const filtered=functions.filter(f=>f.group===key&&norm(f.name+' '+f.description).includes(q)&&(status==='all'||status==='current'&&f.status!=='deprecated'&&f.status!=='deprecated_alias'||status==='deprecated'&&(f.status==='deprecated'||f.status==='deprecated_alias')));
    $('#group-list').innerHTML=filtered.map(functionRow).join('')||'<div class="empty-results"><strong>Sin coincidencias</strong><p>No hay funciones que coincidan con este filtro.</p></div>';
    $('#group-count').textContent=filtered.length+' funciones';
   };
   inp.addEventListener('input',refresh);
   $$('.filter-pill').forEach(b=>b.addEventListener('click',()=>{status=b.dataset.status;$$('.filter-pill').forEach(p=>p.classList.toggle('active',p===b));refresh()}));
 }
}
function render(){
 const parts=routeParts(), key=parts.join('/');if(key===currentRoute)return;currentRoute=key;
 let html='',section=[];
 if(parts[0]==='guide'){
  const g=guideMap.get(parts[1]||'inicio');if(g){html=g.id==='inicio'?landing():guidePage(g);section=[g.group,g.title];document.title=g.title+' — pseudocord.js'}else{html=notFound();section=['404']}
 }else if(parts[0]==='reference'){
  if(parts.length===1){html=referenceIndex();section=['Referencia de funciones'];document.title='Funciones — pseudocord.js'}
  else if(parts.length===2&&groups[parts[1]]){html=groupPage(parts[1]);section=['Referencia',groups[parts[1]].title];document.title=groups[parts[1]].title+' — pseudocord.js'}
  else if(parts.length>=3){const f=byName.get(parts[2]);if(f&&f.group===parts[1]){html=functionPage(f);section=['Referencia',f.name+'()'];document.title=f.name+'() — pseudocord.js'}else{html=notFound();section=['404']}}
  else{html=notFound();section=['404']}
 }else{html=notFound();section=['404']}
 content.innerHTML=html;setBread(...section);activeNav(parts);decorateCode();updateTOC();bindLocalFilters(parts);closeNav();window.scrollTo({top:0,behavior:'instant'});
}
function openNav(){$('#sidebar').classList.add('open');$('#sidebar-backdrop').classList.add('open')}
function closeNav(){$('#sidebar').classList.remove('open');$('#sidebar-backdrop').classList.remove('open')}
function openSearch(){searchDialog.classList.add('open');searchDialog.setAttribute('aria-hidden','false');searchInput.value='';updateSearch();setTimeout(()=>searchInput.focus(),0)}
function closeSearch(){searchDialog.classList.remove('open');searchDialog.setAttribute('aria-hidden','true');$('#open-search').focus()}
const indexed=[...guides.map(g=>({name:g.title,desc:g.summary,group:'Guía',url:linkGuide(g),weight:3})),...functions.map(f=>({name:f.name,desc:f.description,group:groups[f.group].title,url:linkFunction(f),weight:2}))];
function updateSearch(){
 const query=norm(searchInput.value.trim()),terms=query.split(/\s+/).filter(Boolean);
 searchHits=indexed.map(item=>{
 const n=norm(item.name),d=norm(item.desc),g=norm(item.group),text=n+' '+d+' '+g;
 if(terms.some(t=>!text.includes(t)))return null;
 let score=item.weight;
 if(n===query)score+=100;if(n.startsWith(query)&&query)score+=35;
 if(n.includes(query)&&query)score+=15;
 for(const t of terms){if(n.startsWith(t))score+=6;if(g.includes(t))score+=2;}
 return {item,score};
 }).filter(Boolean).sort((a,b)=>b.score-a.score||a.item.name.localeCompare(b.item.name,'es')).slice(0,30).map(x=>x.item);
 selectedSearch=0;paintSearch();
}
function paintSearch(){
 if(!searchHits.length){searchResults.innerHTML='<div class="empty-results"><strong>Sin resultados</strong><p>No se encontró ninguna entrada. Prueba con otro término.</p></div>';return}
 searchResults.innerHTML=searchHits.map((x,i)=>`<button type="button" class="search-result ${i===selectedSearch?'selected':''}" data-search-index="${i}"><span class="result-icon">${x.group==='Guía'?'⌘':'ƒ'}</span><span><strong>${escapeHTML(x.name)}</strong><small>${escapeHTML(x.desc)}</small></span><em>${escapeHTML(x.group)}</em></button>`).join('');
}
searchInput.addEventListener('input',updateSearch);
searchResults.addEventListener('click',e=>{const el=e.target.closest('[data-search-index]');if(!el)return;const hit=searchHits[Number(el.dataset.searchIndex)];if(hit){location.hash=hit.url;closeSearch();if(currentRoute===routeParts().join('/'))render()}});
searchInput.addEventListener('keydown',e=>{
 if(e.key==='ArrowDown'){e.preventDefault();selectedSearch=Math.min(searchHits.length-1,selectedSearch+1);paintSearch();$('.search-result.selected',searchResults)?.scrollIntoView({block:'nearest'})}
 if(e.key==='ArrowUp'){e.preventDefault();selectedSearch=Math.max(0,selectedSearch-1);paintSearch();$('.search-result.selected',searchResults)?.scrollIntoView({block:'nearest'})}
 if(e.key==='Enter'&&searchHits.length){e.preventDefault();location.hash=searchHits[selectedSearch].url;closeSearch()}
});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return}
 if(e.key==='Escape'&&searchDialog.classList.contains('open')){e.preventDefault();closeSearch();return}
 if(e.key==='/'&&!searchDialog.classList.contains('open')&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();openSearch()}
});
$('#open-search').addEventListener('click',openSearch);
$('#close-search-overlay').addEventListener('click',closeSearch);
$('#open-nav').addEventListener('click',openNav);
$('#close-nav').addEventListener('click',closeNav);
$('#sidebar-backdrop').addEventListener('click',closeNav);
document.addEventListener('click',async e=>{
 const b=e.target.closest('.copy-code');if(!b)return;
 const root=b.closest('pre,.code-block');const code=root?.querySelector('code');if(!code)return;
 try{await navigator.clipboard.writeText(code.textContent);const original=b.textContent;b.textContent='Copiado ✓';setTimeout(()=>b.textContent=original,1600)}
 catch{const ta=document.createElement('textarea');ta.value=code.textContent;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');b.textContent='Copiado ✓'}finally{ta.remove();setTimeout(()=>b.textContent='Copiar',1600)}}
});
window.addEventListener('hashchange',render);
sidebar();render();
})();

</script>
