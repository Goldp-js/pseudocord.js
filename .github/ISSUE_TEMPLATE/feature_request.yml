
name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the limitation or requirement.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain how the feature should work.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Proposed syntax or API
      description: Provide an example if applicable.
      render: text

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe alternative approaches, if any.

  - type: dropdown
    id: category
    attributes:
      label: Feature category
      options:
        - Language Syntax
        - Built-in Functions
        - Runtime
        - Discord Integration
        - Plugins / Modules
        - Developer Tools
        - Other
    validations:
      required: true
