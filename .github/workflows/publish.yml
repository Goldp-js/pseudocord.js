
name: Publish npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --if-present

      - name: Validate package
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$PACKAGE_NAME" != "pseudocord.js" ]; then
            echo "::error::Unexpected package name: $PACKAGE_NAME"
            exit 1
          fi

          if [[ ! "$PACKAGE_VERSION" =~ -alpha\. ]]; then
            echo "::error::Package version must be an alpha prerelease"
            exit 1
          fi

          echo "Package: $PACKAGE_NAME"
          echo "Version: $PACKAGE_VERSION"

      - name: Publish to npm
        run: npm publish --tag alpha --provenance
